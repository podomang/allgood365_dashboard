function progressPercent(row) {
  const total = row.total_units ?? (row.clm_textbooks && row.clm_textbooks.total_units) ?? null;

  return Math.max(0, Math.min(100, Math.round((row.current_unit / total) * 100)));
}

}

  const submit = async (e) => {

    setError("");
    setLoading(true);

    setLoading(false);

  return h("div", { style: { background: PAPER, minHeight: "100vh" }, className: "flex items-center justify-center px-4" },
    h("div", { className: "w-full max-w-sm rounded-2xl p-6", style: { background: "#fff", border: `1px solid ${LINE}` } },

      h("div", { style: { fontWeight: 800, fontSize: 15, textAlign: "center", marginBottom: 18, color: INK } }, "수업관리 시스템 로그인"),
      h("form", { onSubmit: submit, className: "flex flex-col gap-3" },

          className: "px-3 py-3 rounded-lg text-sm outline-none", style: { border: `1px solid ${LINE}` } }),
        h("input", { type: "password", required: true, value: password, onChange: (e) => setPassword(e.target.value), placeholder: "비밀번호",
          className: "px-3 py-3 rounded-lg text-sm outline-none", style: { border: `1px solid ${LINE}` } }),
        error && h("div", { style: { color: RED, fontSize: 12.5, fontWeight: 600 } }, error),

    )
  );
}

// ============================================================
// 과정(중등/고등) 분류 - 선택지 & 정렬 순서
// ============================================================
const MS_GRADES = ["중1", "중2", "중3"];
const SEMESTERS = ["1학기", "2학기"];
const HS_COURSES = ["공통수학1", "공통수학2", "대수", "미적분Ⅰ", "확률과통계", "미적분Ⅱ", "기하"];

function textbookGroupInfo(tb) {
  if (tb.track === "중등") {
    const g = MS_GRADES.indexOf(tb.grade);
    const s = SEMESTERS.indexOf(tb.semester);
    return {
      key: "중등|" + (tb.grade || "") + "|" + (tb.semester || ""),
      label: "중등 · " + (tb.grade || "학년 미지정") + (tb.semester ? " " + tb.semester : ""),
      order: [0, g === -1 ? 99 : g, s === -1 ? 99 : s],
    };
  }
  if (tb.track === "고등") {
    const c = HS_COURSES.indexOf(tb.course_name);
    return {
      key: "고등|" + (tb.course_name || ""),
      label: "고등 · " + (tb.course_name || "과정 미지정"),
      order: [1, c === -1 ? 99 : c, 0],
    };
  }
  return { key: "미분류", label: "과정 미지정", order: [2, 0, 0] };
}

function groupTextbooks(textbooks) {
  const map = new Map();
  textbooks.forEach((tb) => {
    const info = textbookGroupInfo(tb);
    if (!map.has(info.key)) map.set(info.key, { label: info.label, order: info.order, items: [] });
    map.get(info.key).items.push(tb);
  });
  return Array.from(map.values()).sort((a, b) => {
    for (let i = 0; i < a.order.length; i++) {
      if (a.order[i] !== b.order[i]) return a.order[i] - b.order[i];
    }
    return a.label.localeCompare(b.label, "ko");
  });
}

function AddTextbookForm({ onAdd, onClose }) {
  const [track, setTrack] = useState("");
  const [grade, setGrade] = useState("");
  const [semester, setSemester] = useState("");
  const [courseName, setCourseName] = useState("");
  const [name, setName] = useState("");
  const [publisher, setPublisher] = useState("");
  const [category, setCategory] = useState("개념서");
  const [unitLabel, setUnitLabel] = useState("페이지");
  const [totalUnits, setTotalUnits] = useState("");
  const [saving, setSaving] = useState(false);

  const changeTrack = (value) => {
    setTrack(value);
    setGrade("");
    setSemester("");
    setCourseName("");
  };

  const submit = async (e) => {
    e.preventDefault();
    if (!name.trim()) return;
    setSaving(true);
    await onAdd({
      name: name.trim(),
      category,
      unit_label: unitLabel,
      total_units: totalUnits ? Number(totalUnits) : null,
      publisher: publisher.trim() || null,
      track: track || null,
      grade: track === "중등" ? (grade || null) : null,
      semester: track === "중등" ? (semester || null) : null,
      course_name: track === "고등" ? (courseName || null) : null,
    });
    setSaving(false);
    onClose();
  };

  const selectStyle = { border: `1px solid ${LINE}` };
  const fieldLabel = { fontSize: 11.5, fontWeight: 700, color: SUBINK, marginBottom: 4, display: "block" };
  const inputClass = "w-full px-3 py-2 rounded-lg text-sm outline-none";

  return h("form", { onSubmit: submit, className: "rounded-2xl p-4 mb-4 flex flex-col gap-3", style: { background: PAPER, border: `1px solid ${LINE}` } },
    h("div", { className: "flex flex-wrap items-end gap-3" },
      h("div", { style: { width: 128 } },
        h("label", { style: fieldLabel }, "과정"),
        h("select", { value: track, onChange: (e) => changeTrack(e.target.value),
          className: inputClass, style: { ...selectStyle, background: "#fff" } },

function StudentProgressRow({ row, isDirector, onUpdateUnit, onRemove }) {
  const [unit, setUnit] = useState(row.current_unit);
  useEffect(() => setUnit(row.current_unit), [row.current_unit]);
  const total = row.total_units ?? (row.clm_textbooks && row.clm_textbooks.total_units) ?? null;
  const percent = progressPercent(row);
  const student = row.attn_students || {};
  const style = catStyle(row.clm_textbooks ? row.clm_textbooks.category : "기타");
  const unitLabel = (row.clm_textbooks && row.clm_textbooks.unit_label) || "";

  const commit = () => {
    const n = Number(unit);
    if (!Number.isFinite(n) || n < 0) { setUnit(row.current_unit); return; }
    if (n !== row.current_unit) onUpdateUnit(row.id, n);
  };

  const stepBtn = { width: 24, height: 24, borderRadius: 8, border: `1px solid ${LINE}`, background: "#fff", color: SUBINK, fontWeight: 700 };

  return h("div", { className: "flex items-center gap-3 px-3 py-2.5" },
    h("div", { style: { width: 132, flexShrink: 0 } },
      h("p", { style: { fontSize: 13, fontWeight: 700, color: INK, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" } }, student.name || "(알 수 없음)"),
      h("p", { style: { fontSize: 11, color: SUBINK, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" } }, [student.school, student.grade].filter(Boolean).join(" · "))
    ),
    h("div", { className: "flex-1" }, h(ProgressBar, { percent, color: style.color })),
    h("div", { className: "flex items-center gap-1.5", style: { flexShrink: 0, fontSize: 12, color: SUBINK, fontWeight: 600 } },
      isDirector
        ? h(React.Fragment, null,
            h("button", { type: "button", onClick: () => onUpdateUnit(row.id, Math.max(0, row.current_unit - 1)), style: stepBtn }, "－"),
            h("input", {
              type: "number", value: unit, onChange: (e) => setUnit(e.target.value), onBlur: commit,
              className: "text-center rounded-lg text-sm outline-none", style: { width: 52, padding: "4px 2px", border: `1px solid ${LINE}` },
            }),
            h("button", { type: "button", onClick: () => onUpdateUnit(row.id, row.current_unit + 1), style: stepBtn }, "＋")
          )
        : h("span", { style: { fontWeight: 700, color: INK } }, row.current_unit),
      h("span", null, "/ ", total ?? "?", unitLabel)
    ),
    isDirector && h("button", { type: "button", onClick: () => onRemove(row.id), title: "배정 해제",
      style: { flexShrink: 0, color: SUBINK, fontSize: 13, padding: "0 4px" } }, "✕")
  );
}

// ============================================================
// 학생별 보기 - 그룹핑 옵션
// ============================================================
const STUDENT_GROUP_MODES = [
  { key: "none", label: "전체" },
  { key: "textbook", label: "교재별" },
  { key: "track", label: "과정별" },
  { key: "grade", label: "학년별" },
  { key: "school", label: "학교별" },
];

// 학교명 끝글자(초/중/고)로 급별을 구분. attn_students.school은 "덕원고", "시지중", "성암초"처럼
// 줄임 표기로 저장되어 있어서 이 방식으로 안전하게 구분 가능 (학년(grade)만으로는 중1/고1이 둘 다 "1"이라 구분 불가).
const SCHOOL_LEVEL_ORDER = { "초": 0, "중": 1, "고": 2 };
function schoolLevelPrefix(school) {
  if (!school) return null;
  const s = school.trim();
  const last = s.slice(-1);
  return SCHOOL_LEVEL_ORDER.hasOwnProperty(last) ? last : null;
}

function sortGroups(groups) {
  return groups.sort((a, b) => {
    const len = Math.max(a.order.length, b.order.length);
    for (let i = 0; i < len; i++) {
      const av = a.order[i] ?? 0, bv = b.order[i] ?? 0;
      if (av !== bv) return av - bv;
    }
    return a.label.localeCompare(b.label, "ko");
  });
}

function buildStudentGroups(mode, students, textbooks, progress) {
  if (mode === "none") return null;

  const map = new Map();
  const addToGroup = (key, label, order, student) => {
    if (!map.has(key)) map.set(key, { label, order, items: [] });
    const g = map.get(key);
    if (!g.items.some((s) => s.id === student.id)) g.items.push(student);
  };

  if (mode === "school") {
    students.forEach((s) => addToGroup(s.school || "", s.school || "학교 미등록", [0], s));
  } else if (mode === "grade") {
    students.forEach((s) => {
      const level = schoolLevelPrefix(s.school);
      const gradeNum = (s.grade || "").trim();
      if (!level && !gradeNum) { addToGroup("__none__", "학년 미등록", [9, 0], s); return; }
      const key = (level || "?") + "|" + gradeNum;
      const label = level ? level + gradeNum : "급 미확인 · " + gradeNum + "학년";
      const order = [level ? SCHOOL_LEVEL_ORDER[level] : 9, Number(gradeNum) || 99];
      addToGroup(key, label, order, s);
    });
  } else if (mode === "track" || mode === "textbook") {
    const byId = new Map(students.map((s) => [s.id, s]));
    progress.forEach((p) => {
      const student = byId.get(p.student_id);
      if (!student) return;
      const tb = textbooks.find((t) => t.id === p.textbook_id) || p.clm_textbooks;
      if (!tb) return;
      if (mode === "textbook") {
        addToGroup("tb|" + p.textbook_id, tb.name || "(삭제된 교재)", [0], student);
      } else {
        const info = textbookGroupInfo(tb);
        addToGroup(info.key, info.label, info.order, student);
      }
    });
    const assignedIds = new Set(progress.map((p) => p.student_id));
    students.forEach((s) => {
      if (!assignedIds.has(s.id)) addToGroup("__unassigned__", mode === "textbook" ? "배정 교재 없음" : "과정 미지정", [9], s);
    });
  }

  return sortGroups(Array.from(map.values()));
}

  const [errorMsg, setErrorMsg] = useState("");

  const loadAll = useCallback(async () => {
    setErrorMsg("");
    const [studentsRes, textbooksRes, progressRes] = await Promise.all([
      supabaseClient.from("attn_students").select("id,name,school,grade,class").neq("status", "퇴원").order("name"),
      supabaseClient.from("clm_textbooks").select("*").order("created_at"),
      supabaseClient.from("clm_textbook_progress")
        .select("*, clm_textbooks(name,category,total_units,unit_label), attn_students(name,school,grade,class)")
        .eq("scope", "student"),
    ]);
    if (studentsRes.error || textbooksRes.error || progressRes.error) {
      setErrorMsg("데이터를 불러오는 중 문제가 생겼어요. 새로고침 해보세요.");
    }
    setStudents(studentsRes.data || []);
    setTextbooks(textbooksRes.data || []);
    setProgress(progressRes.data || []);
    setLoaded(true);
  }, []);

  useEffect(() => { loadAll(); }, [loadAll]);

  // realtime: 다른 사람(원장/직원)이 교재·진도를 바꾸면 자동 반영 (attendance.html과 동일한 패턴)
  useEffect(() => {
    const channel = supabaseClient
      .channel("clm_textbook_changes")
      .on("postgres_changes", { event: "*", schema: "public", table: "clm_textbooks" }, () => loadAll())
      .on("postgres_changes", { event: "*", schema: "public", table: "clm_textbook_progress" }, () => loadAll())
      .subscribe();
    return () => { supabaseClient.removeChannel(channel); };
  }, [loadAll]);

  const actions = {
    addTextbook: async (payload) => {
      const { error } = await supabaseClient.from("clm_textbooks").insert(payload);
      if (error) { setErrorMsg("교재 추가에 실패했어요: " + error.message); return; }
      await loadAll();
    },
    deleteTextbook: async (id) => {
      if (!window.confirm("이 교재를 삭제하면 배정된 학생들의 진도 기록도 함께 삭제돼요. 계속할까요?")) return;
      const { error } = await supabaseClient.from("clm_textbooks").delete().eq("id", id);
      if (error) { setErrorMsg("교재 삭제에 실패했어요: " + error.message); return; }
      await loadAll();
    },
    assignStudent: async (textbookId, studentId) => {
      const { error } = await supabaseClient.from("clm_textbook_progress").insert({
        textbook_id: textbookId, student_id: studentId, scope: "student", current_unit: 0, updated_by: session.user.email,
      });
      if (error) { setErrorMsg("학생 배정에 실패했어요: " + error.message); return; }
      await loadAll();
    },
    removeProgress: async (progressId) => {
      const { error } = await supabaseClient.from("clm_textbook_progress").delete().eq("id", progressId);
      if (error) { setErrorMsg("배정 해제에 실패했어요: " + error.message); return; }
      await loadAll();
    },
    updateUnit: async (progressId, newUnit) => {
      setProgress((prev) => prev.map((p) => (p.id === progressId ? { ...p, current_unit: newUnit } : p)));
      const { error } = await supabaseClient.from("clm_textbook_progress")
        .update({ current_unit: newUnit, updated_at: new Date().toISOString(), updated_by: session.user.email })
        .eq("id", progressId);
      if (error) { setErrorMsg("진도 저장에 실패했어요: " + error.message); await loadAll(); }
    },
  };

  const stats = useMemo(() => {
    const withTotal = progress.map(progressPercent).filter((p) => p !== null);
    const avg = withTotal.length ? Math.round(withTotal.reduce((a, b) => a + b, 0) / withTotal.length) : null;
    return { studentCount: students.length, textbookCount: textbooks.length, assignedCount: progress.length, avgPercent: avg };
  }, [students, textbooks, progress]);

  if (!loaded) return h("div", { style: { color: SUBINK, fontSize: 13, padding: "40px 0", textAlign: "center" } }, "불러오는 중...");

  const statCards = [
    ["등록 학생", stats.studentCount + "명", NAVY],
    ["등록 교재", stats.textbookCount + "권", TEAL],
    ["배정 건수", stats.assignedCount + "건", PURPLE],
    ["평균 진도", stats.avgPercent !== null ? stats.avgPercent + "%" : "—", AMBER],
  ];

  return h("div", null,
    errorMsg && h("div", { className: "rounded-xl px-4 py-2.5 mb-4", style: { background: RED_SOFT, color: RED, fontSize: 12.5, fontWeight: 600 } }, errorMsg),
    h("div", { className: "grid grid-cols-2 sm:grid-cols-4 gap-2.5 mb-5" },
      statCards.map(([label, value, color]) =>
        h("div", { key: label, className: "rounded-xl px-3 py-3", style: { background: "#fff", border: `1px solid ${LINE}` } },
          h("div", { style: { fontSize: 11, color: SUBINK, fontWeight: 700 } }, label),
          h("div", { style: { fontSize: 16, fontWeight: 800, color: color } }, value)
        )
      )
    ),
    h("div", { className: "flex items-center gap-2 mb-4 flex-wrap" },
      ["byBook", "byStudent"].map((mode) =>
        h("button", { key: mode, type: "button", onClick: () => setViewMode(mode),
          className: "px-3 py-1.5 rounded-lg text-xs font-bold",
          style: { background: viewMode === mode ? NAVY : "#fff", color: viewMode === mode ? "#fff" : SUBINK, border: `1px solid ${viewMode === mode ? NAVY : LINE}` } },
          mode === "byBook" ? "교재별 보기" : "학생별 보기")
      ),
      !isDirector && h("span", { style: { marginLeft: "auto", fontSize: 11.5, color: SUBINK } }, "조회 전용 계정입니다 (진도 입력은 원장 계정에서 가능해요)")
    ),
    viewMode === "byBook"
      ? h(TextbookListView, { textbooks, progress, students, isDirector, actions })
      : h(StudentListView, { students, textbooks, progress, isDirector, actions })
  );
}

function AddAssignmentForm({ students, textbooks, onAdd, onClose, session }) {
  const [studentId, setStudentId] = useState("");

  const [textbookId, setTextbookId] = useState("");
  const [classDate, setClassDate] = useState(() => new Date().toISOString().slice(0, 10));

  const [rangeTo, setRangeTo] = useState("");
  const [dueDate, setDueDate] = useState("");
  const [saving, setSaving] = useState(false);

  const selectedStudent = students.find((s) => s.id === studentId);

    if (!studentQ.trim()) return [];
    return students.filter((s) => (s.name + " " + (s.school || "")).includes(studentQ.trim())).slice(0, 15);

  const canSubmit = studentId && description.trim() && dueDate && !saving;

  const submit = async () => {

    setSaving(true);

                h("span", { style: { color: TEAL, fontSize: 11, fontWeight: 700 } }, "선택")

        h("label", { style: { fontSize: 11.5, color: SUBINK, fontWeight: 700, display: "block", marginBottom: 4 } }, "관련 교재 (선택)"),

function AssignStampButton({ state, disabled, onClick }) {
  // state: "none" (미배정) | "assigned" (오늘 이 내용으로 배정됨, 취소 가능) | "locked" (이미 제출/코멘트가 있어 취소 불가)
  const [popped, setPopped] = useState(false);
  const isOn = state !== "none";
  const label = state === "none" ? "배정" : state === "assigned" ? "✓ 배정됨" : "🔒 진행중";
  return h("button", {
    type: "button",
    disabled: disabled || state === "locked",
    onClick: () => {
      if (disabled || state === "locked") return;
      onClick();
      if (state === "none") { setPopped(true); setTimeout(() => setPopped(false), 260); }
    },
    className: "px-3 py-1.5 rounded-lg text-xs font-bold border whitespace-nowrap flex-shrink-0",
    style: {
      background: isOn ? (state === "locked" ? LINE : TEAL) : "#fff",
      color: isOn ? (state === "locked" ? SUBINK : "#fff") : (disabled ? SUBINK : TEAL),
      borderColor: isOn ? (state === "locked" ? LINE : TEAL) : (disabled ? LINE : TEAL),
      opacity: disabled && state === "none" ? 0.5 : 1,
      transform: popped ? "scale(1.08)" : "scale(1)",
      transition: "transform 150ms ease, background 120ms ease, color 120ms ease, border-color 120ms ease",
      cursor: disabled || state === "locked" ? "default" : "pointer",
    },
  }, label);
}

function AssignRosterView({ students, textbooks, progress, assignments, onAssign, onCancelAssign }) {
  const [groupMode, setGroupMode] = useState("none");
  const [q, setQ] = useState("");
  const [collapsedGroups, setCollapsedGroups] = useState({});
  const [busyIds, setBusyIds] = useState({});
  const [template, setTemplate] = useState(() => ({
    description: "", textbookId: "", classDate: new Date().toISOString().slice(0, 10),
    rangeFrom: "", rangeTo: "", dueDate: "",
  }));

  const ready = template.description.trim() !== "" && template.dueDate !== "";

  const filtered = useMemo(() => {
    if (!q.trim()) return students;
    return students.filter((s) => (s.name + " " + (s.school || "") + " " + (s.class || "")).includes(q.trim()));
  }, [students, q]);

  const groups = useMemo(() => buildStudentGroups(groupMode, filtered, textbooks, progress), [groupMode, filtered, textbooks, progress]);

  const stateFor = (studentId) => {
    const desc = template.description.trim();
    const match = assignments.find((a) => a.student_id === studentId && a.class_date === template.classDate && a.description === desc);
    if (!match) return { state: "none", assignmentId: null };
    const locked = match.status === "제출완료" || !!match.teacher_comment || !!match.student_note;
    return { state: locked ? "locked" : "assigned", assignmentId: match.id };
  };

  const toggle = async (s) => {
    if (!ready) return;
    const { state, assignmentId } = stateFor(s.id);
    if (state === "locked") return;
    setBusyIds((b) => ({ ...b, [s.id]: true }));
    try {
      if (state === "assigned") {
        await onCancelAssign(assignmentId);
      } else {
        await onAssign({
          student_id: s.id,
          textbook_id: template.textbookId || null,
          class_date: template.classDate,
          description: template.description.trim(),
          range_from: template.rangeFrom ? Number(template.rangeFrom) : null,
          range_to: template.rangeTo ? Number(template.rangeTo) : null,
          due_date: template.dueDate,
        });
      }
    } finally {
      setBusyIds((b) => { const n = { ...b }; delete n[s.id]; return n; });
    }
  };

  const toggleGroupCollapsed = (key) => setCollapsedGroups((prev) => ({ ...prev, [key]: !prev[key] }));

  const renderRow = (s, isLast) => {
    const { state } = stateFor(s.id);
    return h(AssignRosterRow, { key: s.id, s, isLast, state, disabled: !ready || !!busyIds[s.id], onToggle: () => toggle(s) });
  };

  const assignedCount = filtered.filter((s) => stateFor(s.id).state !== "none").length;

  return h("div", null,
    h(QuickAssignBar, { template, setTemplate, textbooks }),
    h("div", { className: "flex items-center justify-between flex-wrap gap-2 mb-3" },
      h("input", { value: q, onChange: (e) => setQ(e.target.value), placeholder: "학생 이름 · 학교 · 반으로 검색",
        className: "px-3 py-2 rounded-lg text-sm outline-none", style: { border: `1px solid ${LINE}`, background: "#fff", minWidth: 200 } }),
      ready && h("span", { style: { fontSize: 11.5, color: SUBINK, fontWeight: 700 } }, assignedCount, " / ", filtered.length, "명 배정됨")
    ),
    h("div", { className: "flex items-center gap-1.5 mb-4 flex-wrap" },
      ASSIGN_GROUP_MODES.map((m) =>
        h("button", { key: m.key, type: "button", onClick: () => setGroupMode(m.key),
          className: "px-3 py-1.5 rounded-lg text-xs font-bold",
          style: { background: groupMode === m.key ? NAVY : "#fff", color: groupMode === m.key ? "#fff" : SUBINK, border: `1px solid ${groupMode === m.key ? NAVY : LINE}` } },
          m.label)
      )
    ),
    filtered.length === 0
      ? h("div", { className: "rounded-2xl p-10 text-center", style: { background: "#fff", border: `1px solid ${LINE}`, color: SUBINK, fontSize: 13 } }, "검색 결과가 없어요.")
      : groupMode === "none"
        ? h("div", { className: "rounded-2xl overflow-hidden", style: { background: "#fff", border: `1px solid ${LINE}` } },
            filtered.map((s, idx) => renderRow(s, idx === filtered.length - 1))
          )
        : (groups || []).map((g) => h(AssignGroupSection, {
            key: g.label, group: g, collapsed: !!collapsedGroups[g.label],
            onToggleCollapsed: () => toggleGroupCollapsed(g.label), renderRow,
          }))
  );
}

// 과제 카드 (관리자용 - 확인/코멘트 작성)
// ============================================================
function AdminAssignmentCard({ a, isDirector, onDelete, onSaveComment }) {
  const [comment, setComment] = useState(a.teacher_comment || "");
  const [saving, setSaving] = useState(false);
  const isDone = a.status === "제출완료";
  const isOverdue = !isDone && a.due_date && a.due_date < new Date().toISOString().slice(0, 10);

  const save = async () => {
    setSaving(true);
    await onSaveComment(a.id, comment.trim());
    setSaving(false);
  };

  let badgeColor = AMBER, badgeSoft = AMBER_SOFT, badgeLabel = "미제출";
  if (isDone) { badgeColor = TEAL; badgeSoft = TEAL_SOFT; badgeLabel = "제출완료"; }
  else if (isOverdue) { badgeColor = RED; badgeSoft = RED_SOFT; badgeLabel = "기한초과"; }

  return h("div", { className: "rounded-xl p-4 mb-3", style: { background: "#fff", border: `1px solid ${LINE}` } },
    h("div", { className: "flex items-start justify-between gap-2" },
      h("div", null,
        h("div", { style: { fontSize: 11.5, color: SUBINK, marginBottom: 3 } },
          a.attn_students ? a.attn_students.name : "(삭제된 학생)",
          " · ", a.class_date, " 수업",
          a.clm_textbooks ? " · " + a.clm_textbooks.name : ""
        ),
        h("div", { style: { fontSize: 14, fontWeight: 700, color: INK } },
          a.description + (a.range_from ? ` (${a.range_from}~${a.range_to || a.range_from})` : "")
        ),
        h("div", { style: { fontSize: 11.5, color: SUBINK, marginTop: 2 } }, "제출기한: " + a.due_date)
      ),
      h("div", { className: "flex items-center gap-2 flex-shrink-0" },
        h(Badge, { color: badgeColor, soft: badgeSoft }, badgeLabel),
        isDirector && h("button", { type: "button", onClick: () => onDelete(a.id), style: { fontSize: 11, color: SUBINK, fontWeight: 600 } }, "삭제")
      )
    ),

    isDone && h("div", { className: "mt-3 pt-3", style: { borderTop: `1px dashed ${LINE}` } },
      a.student_note && h("div", { style: { fontSize: 12.5, color: INK, marginBottom: 8 } }, "학생 메모: ", a.student_note),
      a.question_photo_urls && a.question_photo_urls.length > 0 && h("div", { className: "flex gap-2 flex-wrap mb-2" },
        a.question_photo_urls.map((url, i) => h("a", { key: i, href: url, target: "_blank", rel: "noreferrer" },
          h("img", { src: url, style: { width: 72, height: 72, objectFit: "cover", borderRadius: 8, border: `1px solid ${LINE}` } })
        ))
      ),
      h("label", { style: { fontSize: 11.5, color: SUBINK, fontWeight: 700, display: "block", marginBottom: 4 } }, "확인 코멘트"),
      isDirector
        ? h(React.Fragment, null,
            h("textarea", {
              value: comment, onChange: (e) => setComment(e.target.value), placeholder: "학생에게 남길 코멘트를 입력하세요",
              className: "w-full px-3 py-2 rounded-lg text-sm outline-none mb-2", style: { border: `1px solid ${LINE}`, minHeight: 56, resize: "vertical", fontFamily: "inherit" },
            }),
            h("button", { type: "button", onClick: save, disabled: saving || comment.trim() === (a.teacher_comment || ""),
              className: "px-4 py-1.5 rounded-lg text-xs font-bold",
              style: { background: NAVY, color: "#fff", opacity: saving || comment.trim() === (a.teacher_comment || "") ? 0.5 : 1 } },
              saving ? "저장 중..." : "코멘트 저장")
          )
        : h("p", { style: { fontSize: 12.5, color: a.teacher_comment ? INK : SUBINK } }, a.teacher_comment || "아직 코멘트가 없어요.")
    )
  );
}

// ============================================================
// 과제 관리 대시보드
// ============================================================
const ASSIGNMENT_FILTERS = [
  { key: "all", label: "전체" },
  { key: "pending", label: "미제출" },
  { key: "done", label: "제출완료" },
];

function AssignmentsDashboard({ session, role }) {
  const isDirector = role === "director";
  const [students, setStudents] = useState([]);
  const [textbooks, setTextbooks] = useState([]);
  const [progress, setProgress] = useState([]);
  const [assignments, setAssignments] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [errorMsg, setErrorMsg] = useState("");
  const [adding, setAdding] = useState(false);
  const [filter, setFilter] = useState("all");
  const [subView, setSubView] = useState(isDirector ? "assign" : "status");

  const loadAll = useCallback(async () => {
    setErrorMsg("");
    const [studentsRes, textbooksRes, progressRes, assignmentsRes] = await Promise.all([
      supabaseClient.from("attn_students").select("id,name,school,grade,class").neq("status", "퇴원").order("name"),
      supabaseClient.from("clm_textbooks").select("id,name,category").order("name"),
      supabaseClient.from("clm_textbook_progress").select("*, clm_textbooks(name,category)").eq("scope", "student"),
      supabaseClient.from("clm_assignments")
        .select("*, attn_students(name,school,grade), clm_textbooks(name)")
        .order("due_date", { ascending: true }),
    ]);
    if (studentsRes.error || textbooksRes.error || progressRes.error || assignmentsRes.error) {
      setErrorMsg("데이터를 불러오는 중 문제가 생겼어요. 새로고침 해보세요.");
    }
    setStudents(studentsRes.data || []);
    setTextbooks(textbooksRes.data || []);
    setProgress(progressRes.data || []);
    setAssignments(assignmentsRes.data || []);
    setLoaded(true);
  }, []);

  useEffect(() => { loadAll(); }, [loadAll]);

  useEffect(() => {
    const channel = supabaseClient
      .channel("clm_assignments_changes")
      .on("postgres_changes", { event: "*", schema: "public", table: "clm_assignments" }, () => loadAll())
      .subscribe();
    return () => { supabaseClient.removeChannel(channel); };
  }, [loadAll]);

  const actions = {
    addAssignment: async (payload) => {
      const { error } = await supabaseClient.from("clm_assignments").insert({ ...payload, created_by: session.user.email });
      if (error) { setErrorMsg("과제 등록에 실패했어요: " + error.message); return; }
      await loadAll();
    },
    cancelAssignment: async (id) => {
      // 관제탑 뷰에서 도장 취소: 확인창 없이 즉시 취소 (아직 제출/코멘트 없는 배정만 가능하도록 위에서 걸러짐)
      const { error } = await supabaseClient.from("clm_assignments").delete().eq("id", id);
      if (error) { setErrorMsg("배정 취소에 실패했어요: " + error.message); return; }
      await loadAll();
    },
    deleteAssignment: async (id) => {
      if (!window.confirm("이 과제를 삭제할까요?")) return;
      const { error } = await supabaseClient.from("clm_assignments").delete().eq("id", id);
      if (error) { setErrorMsg("삭제에 실패했어요: " + error.message); return; }
      await loadAll();
    },
    saveComment: async (id, comment) => {
      const { error } = await supabaseClient.from("clm_assignments")
        .update({ teacher_comment: comment || null, teacher_comment_by: session.user.email, teacher_comment_at: new Date().toISOString() })
        .eq("id", id);
      if (error) { setErrorMsg("코멘트 저장에 실패했어요: " + error.message); return; }
      await loadAll();
    },
  };

  const filtered = useMemo(() => {
    if (filter === "pending") return assignments.filter((a) => a.status !== "제출완료");
    if (filter === "done") return assignments.filter((a) => a.status === "제출완료");
    return assignments;
  }, [assignments, filter]);

  const pendingCount = assignments.filter((a) => a.status !== "제출완료").length;

  if (!loaded) return h("div", { style: { color: SUBINK, fontSize: 13, padding: "40px 0", textAlign: "center" } }, "불러오는 중...");

  return h("div", null,
    errorMsg && h("div", { className: "rounded-xl px-4 py-2.5 mb-4", style: { background: RED_SOFT, color: RED, fontSize: 12.5, fontWeight: 600 } }, errorMsg),

    isDirector && h("div", { className: "flex items-center gap-2 mb-4" },
      [["assign", "배정하기"], ["status", "제출 현황"]].map(([key, label]) =>
        h("button", { key, type: "button", onClick: () => setSubView(key),
          className: "px-4 py-2 rounded-xl text-sm font-bold",
          style: { background: subView === key ? NAVY : "#fff", color: subView === key ? "#fff" : SUBINK, border: `1px solid ${subView === key ? NAVY : LINE}` } },
          label)
      )
    ),

    isDirector && subView === "assign" && h(AssignRosterView, {
      students, textbooks, progress, assignments,
      onAssign: actions.addAssignment, onCancelAssign: actions.cancelAssignment,
    }),

    (!isDirector || subView === "status") && h(React.Fragment, null,
      h("div", { className: "grid grid-cols-2 sm:grid-cols-3 gap-2.5 mb-5" },
        [["전체 과제", assignments.length + "건", NAVY], ["미제출", pendingCount + "건", AMBER], ["제출완료", (assignments.length - pendingCount) + "건", TEAL]].map(([label, value, color]) =>
          h("div", { key: label, className: "rounded-xl px-3 py-3", style: { background: "#fff", border: `1px solid ${LINE}` } },
            h("div", { style: { fontSize: 11, color: SUBINK, fontWeight: 700 } }, label),
            h("div", { style: { fontSize: 16, fontWeight: 800, color } }, value)
          )
        )
      ),

      isDirector && h("div", { className: "mb-4" },
        adding
          ? h(AddAssignmentForm, { students, textbooks, session, onAdd: actions.addAssignment, onClose: () => setAdding(false) })
          : h("button", { type: "button", onClick: () => setAdding(true),
              className: "px-4 py-2.5 rounded-xl text-sm font-bold",
              style: { background: "#fff", color: NAVY, border: `1.5px dashed ${NAVY_SOFT}` } }, "+ 학생 1명 개별 등록")
      ),

      h("div", { className: "flex items-center gap-2 mb-4 flex-wrap" },
        ASSIGNMENT_FILTERS.map((f) =>
          h("button", { key: f.key, type: "button", onClick: () => setFilter(f.key),
            className: "px-3 py-1.5 rounded-lg text-xs font-bold",
            style: { background: filter === f.key ? NAVY : "#fff", color: filter === f.key ? "#fff" : SUBINK, border: `1px solid ${filter === f.key ? NAVY : LINE}` } },
            f.label)
        ),
        !isDirector && h("span", { style: { marginLeft: "auto", fontSize: 11.5, color: SUBINK } }, "조회 전용 계정입니다")
      ),

      filtered.length === 0
        ? h("div", { className: "rounded-2xl p-10 text-center", style: { background: "#fff", border: `1px solid ${LINE}`, color: SUBINK, fontSize: 13 } }, "해당하는 과제가 없어요.")
        : filtered.map((a) => h(AdminAssignmentCard, { key: a.id, a, isDirector, onDelete: actions.deleteAssignment, onSaveComment: actions.saveComment }))
    )
  );
}

// ============================================================
// 수업일지 - 출석체크 명단과 연동된 관제탑 (수업내용 메모 + 과제 배정, 반별 일괄 배정)
// 원장님 전용 화면 (2026-07-31 확인: 조교는 당분간 출결체크 보조 역할만).
// ============================================================
const CLASS_LOG_SESSIONS = { regular: "정규수업", clinic: "클리닉", extra: "보강" };
const CLASS_LOG_SESSION_ORDER = ["regular", "clinic", "extra"];
const KOR_WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];
function korWeekdayOfDate(dateStr) { return KOR_WEEKDAYS[new Date(dateStr + "T00:00:00").getDay()]; }

// attendance.html의 STATUS와 동일한 색상 매핑 — 수업일지 오른쪽 패널의 출결현황 카드에 사용.
const CLASS_LOG_ATTN_STATUS = {
  출석: { color: NAVY, soft: NAVY_SOFT },
  지각: { color: AMBER, soft: AMBER_SOFT },
  조퇴: { color: PURPLE, soft: PURPLE_SOFT },
  결석: { color: RED, soft: RED_SOFT },
  일정변경: { color: SKY, soft: SKY_SOFT },
};

// attendance.html의 extractClassName/groupByClass와 동일한 로직(반명 추출 규칙을 그대로 맞춰야
// 출결체크 화면과 같은 그룹으로 묶임).
function extractClassNameForLog(classStr) {
  const raw = (classStr || "").trim();
  if (!raw) return "";
  const withoutLevel = raw.replace(/^(초등|중등|중학|고등)(?:학교)?과정\s*/, "");
  return withoutLevel.split(/[\s,]+/)[0] || "";
}
function groupRosterByClassName(list) {
  const groups = {};
  list.forEach((s) => {
    const key = extractClassNameForLog(s.class) || "반 미지정";
    (groups[key] = groups[key] || []).push(s);
  });
  return Object.keys(groups)
    .sort((a, b) => (a === "반 미지정" ? 1 : b === "반 미지정" ? -1 : a.localeCompare(b, "ko")))
    .map((k) => ({ label: k, items: groups[k] }));
}
const CLASS_LOG_GROUP_MODES = [
  { key: "none", label: "전체" },
  { key: "class", label: "반별" },
  { key: "grade", label: "학년별" },
];

// 그룹 헤더의 "일괄배정" 버튼을 누르면 그 자리에서 펼쳐지는 미니 입력폼 - 상단에 항상 떠있는 공용
// 템플릿 바 대신, 실제로 반 전체에 같은 과제를 내주고 싶을 때만 그 그룹 헤더 바로 아래에서 입력함.
function GroupBulkAssignBar({ onConfirm, onCancel, busy }) {
  const [desc, setDesc] = useState("");
  const [due, setDue] = useState("");
  const canGo = desc.trim() !== "" && due !== "";
  return h("div", { className: "flex items-center gap-2 flex-wrap px-4 py-2.5", style: { background: NAVY_SOFT, borderBottom: `1px solid ${LINE}` } },
    h("input", { type: "text", autoFocus: true, value: desc, onChange: (e) => setDesc(e.target.value),
      placeholder: "과제 내용 (예: p.32~40 풀어오기)",
      className: "flex-1 min-w-0 px-3 py-2 rounded-lg text-xs outline-none", style: { border: `1px solid ${NAVY}`, background: "#fff", color: INK } }),
    h("input", { type: "date", value: due, onChange: (e) => setDue(e.target.value),
      className: "px-3 py-2 rounded-lg text-xs outline-none flex-shrink-0", style: { border: `1px solid ${NAVY}`, background: "#fff", color: INK } }),
    h("button", { type: "button", onClick: () => onConfirm(desc.trim(), due), disabled: !canGo || busy,
      className: "px-3 py-1.5 rounded-lg text-xs font-bold flex-shrink-0",
      style: { background: canGo ? NAVY : LINE, color: canGo ? "#fff" : SUBINK, opacity: busy ? 0.6 : 1 } },
      busy ? "배정 중..." : "이 그룹에 배정"),
    h("button", { type: "button", onClick: onCancel, className: "px-3 py-1.5 rounded-lg text-xs font-bold flex-shrink-0",
      style: { background: "#fff", color: SUBINK, border: `1px solid ${LINE}` } }, "취소")
  );
}

// 입력창 + 저장 + (기존 값이 있을 때만) 취소 — attendance.html의 ExtraNoteField/ReasonField와 동일한 패턴.
function NoteFieldEditor({ initialValue, placeholder, color, soft, allowEmpty, onSave, onCancel }) {
  const [text, setText] = useState(initialValue);
  const [saving, setSaving] = useState(false);
  const canSave = allowEmpty || text.trim() !== "";
  const save = async () => {
    if (!canSave) return;
    setSaving(true);
    try { await onSave(text.trim()); } finally { setSaving(false); }
  };
  return h("div", { className: "flex gap-2 flex-wrap items-center", style: { flex: "1 1 200px" } },
    h("input", {
      type: "text", autoFocus: true, value: text, onChange: (e) => setText(e.target.value),
      onKeyDown: (e) => { if (e.key === "Enter") save(); }, placeholder,
      className: "flex-1 min-w-0 px-3 py-2 rounded-lg text-xs outline-none", style: { border: `1px solid ${color}`, background: soft, color: INK },
    }),
    h("button", { type: "button", onClick: save, disabled: saving || !canSave,
      className: "px-3 py-1.5 rounded-lg text-xs font-bold flex-shrink-0",
      style: { background: color, color: "#fff", opacity: (saving || !canSave) ? 0.6 : 1 } }, saving ? "저장 중..." : "저장"),
    onCancel && h("button", { type: "button", onClick: onCancel,
      className: "px-3 py-1.5 rounded-lg text-xs font-bold flex-shrink-0",
      style: { background: "#fff", color: SUBINK, border: `1px solid ${LINE}` } }, "취소")
  );
}

// 값이 없으면 아이콘 버튼만 보이다가 누르면 입력창이 열리고, 값이 있으면 배지+연필(수정)로 접혀있음.
// 출결체크 화면의 "수업계획 입력" 칸과 동일한 상호작용 — 수업일지의 수업내용/과제 칸 모두 이 컴포넌트를 씀.
function EditableNote({ value, placeholder, color, soft, icon, iconTitle, locked, allowEmpty, disabled, onSave, onDelete }) {
  const [editing, setEditing] = useState(false);
  if (locked && value) {
    return h("div", { className: "flex items-center gap-1.5 flex-wrap" },
      h("span", { style: { fontSize: 11, fontWeight: 700, background: soft, color, borderRadius: 5, padding: "2.5px 8px" } }, value),
      h("span", { style: { fontSize: 11, color: SUBINK }, title: "제출/코멘트가 있어 수정할 수 없어요" }, "🔒")
    );
  }
  if (!value && !editing) {
    return h("button", { type: "button", onClick: () => { if (!disabled) setEditing(true); }, disabled,
      className: "p-1 rounded-md flex-shrink-0", style: { color, opacity: disabled ? 0.3 : 0.55, cursor: disabled ? "default" : "pointer" }, title: iconTitle }, icon);
  }
  if (!editing) {
    return h("div", { className: "flex items-center gap-1.5 flex-wrap" },
      h("span", { style: { fontSize: 11, fontWeight: 700, background: soft, color, borderRadius: 5, padding: "2.5px 8px" } }, value),
      h("button", { type: "button", onClick: () => setEditing(true), className: "p-1 rounded-md", style: { color }, title: "수정" }, "✎"),
      onDelete && h("button", { type: "button", onClick: onDelete, className: "p-1 rounded-md", style: { color: SUBINK }, title: "삭제" }, "✕")
    );
  }
  return h(NoteFieldEditor, {
    initialValue: value, placeholder, color, soft, allowEmpty,
    onSave: async (val) => { await onSave(val); setEditing(false); },
    onCancel: value ? () => setEditing(false) : null,
  });
}

// 과제 입력칸 - 상단 공용 템플릿 없이, 새로 만들 때 이 자리에서 과제내용+제출기한을 함께 받고 바로 저장.
// (수업 끝난 뒤 학생별로 그때그때 과제를 적는 실제 사용 방식에 맞춤 — 미리 뭔가 채워둘 필요 없음)
// 이미 배정된 과제가 있으면 내용만 수정하는 일반 EditableNote와 같은 방식으로 배지+연필/삭제로 접힘.
function AssignmentEditableField({ assignment, locked, onCreate, onUpdate, onDelete }) {
  const [editing, setEditing] = useState(false);
  const [desc, setDesc] = useState("");
  const [due, setDue] = useState("");
  const [saving, setSaving] = useState(false);

  if (locked && assignment) {
    return h("div", { className: "flex items-center gap-1.5 flex-wrap" },
      h("span", { style: { fontSize: 11, fontWeight: 700, background: TEAL_SOFT, color: TEAL, borderRadius: 5, padding: "2.5px 8px" } }, assignment.description),
      h("span", { style: { fontSize: 11, color: SUBINK }, title: "제출/코멘트가 있어 수정할 수 없어요" }, "🔒")
    );
  }

  if (!editing) {
    if (!assignment) {
      return h("button", { type: "button", onClick: () => { setDesc(""); setDue(""); setEditing(true); },
        className: "p-1 rounded-md flex-shrink-0", style: { color: TEAL, opacity: 0.55 }, title: "과제 추가" }, "✏️");
    }
    return h("div", { className: "flex items-center gap-1.5 flex-wrap" },
      h("span", { style: { fontSize: 11, fontWeight: 700, background: TEAL_SOFT, color: TEAL, borderRadius: 5, padding: "2.5px 8px" } }, assignment.description),
      assignment.due_date && h("span", { style: { fontSize: 10.5, color: SUBINK } }, "~", assignment.due_date, " 까지"),
      h("button", { type: "button", onClick: () => { setDesc(assignment.description); setEditing(true); }, className: "p-1 rounded-md", style: { color: TEAL }, title: "수정" }, "✎"),
      h("button", { type: "button", onClick: onDelete, className: "p-1 rounded-md", style: { color: SUBINK }, title: "삭제" }, "✕")
    );
  }

  const canSave = desc.trim() !== "" && (assignment || due !== "");
  const save = async () => {
    if (!canSave) return;
    setSaving(true);
    try {
      if (assignment) await onUpdate(desc.trim());
      else await onCreate(desc.trim(), due);
      setEditing(false);
    } finally { setSaving(false); }
  };

  return h("div", { className: "flex gap-2 flex-wrap items-center", style: { flex: "1 1 260px" } },
    h("input", { type: "text", autoFocus: true, value: desc, onChange: (e) => setDesc(e.target.value),
      onKeyDown: (e) => { if (e.key === "Enter" && canSave) save(); }, placeholder: "과제 입력 (예: p.32~40 풀어오기)",
      className: "flex-1 min-w-0 px-3 py-2 rounded-lg text-xs outline-none", style: { border: `1px solid ${TEAL}`, background: TEAL_SOFT, color: INK } }),
    !assignment && h("input", { type: "date", value: due, onChange: (e) => setDue(e.target.value),
      className: "px-3 py-2 rounded-lg text-xs outline-none flex-shrink-0", style: { border: `1px solid ${TEAL}`, background: TEAL_SOFT, color: INK } }),
    h("button", { type: "button", onClick: save, disabled: saving || !canSave,
      className: "px-3 py-1.5 rounded-lg text-xs font-bold flex-shrink-0",
      style: { background: TEAL, color: "#fff", opacity: (saving || !canSave) ? 0.6 : 1 } }, saving ? "저장 중..." : "저장"),
    h("button", { type: "button", onClick: () => setEditing(false),
      className: "px-3 py-1.5 rounded-lg text-xs font-bold flex-shrink-0",
      style: { background: "#fff", color: SUBINK, border: `1px solid ${LINE}` } }, "취소")
  );
}

// 학생 한 줄 = 이름/기본정보 + 출결·특강 배지 + 수업내용/과제 입력칸. 이름을 누르면 그 줄 아래로
// 학습현황(최근 과제이력)·근무일지가 펼쳐짐(필요할 때만 상세를 보는 구조).
// 오른쪽 상세 패널에서 선택된 학생 한 명의 수업내용/과제 입력칸만 담당(아바타·이름 등 헤더는
// 오른쪽 패널 쪽에서 별도로 그림). 과제는 하루에 여러 건 붙을 수 있어서(예: 과목별로 따로, 또는
// 수업 중 추가로 더 내주는 경우) 배정된 과제를 목록으로 보여주고, 맨 아래에 "과제 추가" 아이콘을
// 항상 하나 더 둬서 몇 건이든 계속 추가할 수 있게 했다.
function ClassLogRow({ s, note, onSaveNote, assignments, onCreateAssignment, onUpdateAssignment, onDeleteAssignment }) {
  return h("div", { className: "flex flex-col gap-3" },
    h("div", { className: "flex items-center gap-1.5 flex-wrap" },
      h("span", { style: { fontSize: 10.5, color: SUBINK, fontWeight: 700, width: 32, flexShrink: 0 } }, "수업"),
      h(EditableNote, {
        value: note, placeholder: "수업내용 입력 (예: 3단원 인수분해 복습)", color: PURPLE, soft: PURPLE_SOFT,
        icon: "📝", iconTitle: "수업내용 추가", allowEmpty: true, onSave: onSaveNote,
      })
    ),
    h("div", { className: "flex items-start gap-1.5 flex-wrap" },
      h("span", { style: { fontSize: 10.5, color: SUBINK, fontWeight: 700, width: 32, flexShrink: 0, marginTop: 6 } }, "과제"),
      h("div", { className: "flex flex-col gap-1.5", style: { flex: "1 1 220px", minWidth: 200 } },
        (assignments || []).map((a) => {
          const locked = a.status === "제출완료" || !!a.teacher_comment || !!a.student_note;
          return h(AssignmentEditableField, {
            key: a.id, assignment: a, locked,
            onUpdate: (desc) => onUpdateAssignment(a.id, desc),
            onDelete: () => onDeleteAssignment(a.id),
          });
        }),
        h(AssignmentEditableField, {
          key: "new", assignment: null, locked: false,
          onCreate: (desc, due) => onCreateAssignment(s, desc, due),
        })
      )
    )
  );
}

// 왼쪽 학생목록 패널용 - 이름을 누르면 오른쪽 상세 패널에서 선택되고, 수업내용/과제 기록 여부·오늘
// 출결상태·특강 여부를 점/아이콘으로 미리 보여준다.

  },
    h("div", {
      style: { width: 26, height: 26, borderRadius: 8, background: active ? NAVY : NAVY_SOFT, color: active ? "#fff" : NAVY, fontWeight: 800, fontSize: 11 },
      className: "flex items-center justify-center flex-shrink-0",
    }, s.name.slice(0, 1)),
    h("div", { className: "flex-1 min-w-0" },
      h("div", { style: { fontWeight: 700, fontSize: 12.5, color: active ? NAVY : INK, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" } }, s.name),
      h("div", { style: { fontSize: 10.5, color: SUBINK, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" } },
        [s.school, s.grade ? s.grade + "학년" : ""].filter(Boolean).join(" · ") || "정보 미등록")
    ),
    h("div", { className: "flex items-center gap-1 flex-shrink-0" },
      statusMeta && h("span", { style: { width: 6, height: 6, borderRadius: 999, background: statusMeta.color, display: "inline-block" }, title: `오늘 출결: ${attnStatus}` }),
      hasCourse && h("span", { style: { fontSize: 10 }, title: "오늘 특강 있음" }, "🎓"),
      hasNote && h("span", { style: { fontSize: 10 }, title: "수업내용 기록됨" }, "📝"),
      hasAssignment && h("span", { style: { fontSize: 10 }, title: "과제 배정됨" }, "✏️")
    )
  );
}

function ClassLogGroupSection({ group, collapsed, onToggleCollapsed, renderRow, bulkFormOpen, onToggleBulkForm, onConfirmBulkAssign, groupBusy }) {
  return h("div", { className: "rounded-2xl overflow-hidden mb-3", style: { background: "#fff", border: `1px solid ${LINE}` } },
    h("div", { className: "w-full px-4 py-2.5 flex items-center justify-between flex-wrap gap-2", style: { background: PAPER, borderBottom: (collapsed && !bulkFormOpen) ? "none" : `1px solid ${LINE}` } },
      h("button", { type: "button", onClick: onToggleCollapsed, className: "flex items-center gap-2 flex-1 text-left" },
        h("span", { style: { fontWeight: 800, fontSize: 13 } }, group.label),
        h("span", { style: { fontSize: 11.5, color: SUBINK, fontWeight: 700 } }, group.items.length, "명"),
        h("span", { style: { fontSize: 11, color: SUBINK } }, collapsed ? "▼ 펼치기" : "▲ 접기")
      ),
      h("button", { type: "button", onClick: onToggleBulkForm,
        className: "px-3 py-1.5 rounded-lg text-xs font-bold flex-shrink-0",
        style: { background: bulkFormOpen ? "#fff" : NAVY, color: bulkFormOpen ? SUBINK : "#fff", border: bulkFormOpen ? `1px solid ${LINE}` : "none" } },
        bulkFormOpen ? "취소" : "이 그룹에 일괄배정")
    ),
    bulkFormOpen && h(GroupBulkAssignBar, { onConfirm: onConfirmBulkAssign, onCancel: onToggleBulkForm, busy: groupBusy }),
    !collapsed && group.items.map((s, idx) => renderRow(s, idx === group.items.length - 1))
  );
}

function ClassLogDashboard({ session }) {
  const [selectedDate, setSelectedDate] = useState(() => new Date().toISOString().slice(0, 10));
  const [activeSession, setActiveSession] = useState("regular");
  const [groupMode, setGroupMode] = useState("none");
  const [students, setStudents] = useState([]);
  const [extraRows, setExtraRows] = useState([]);
  const [classLogs, setClassLogs] = useState([]);
  const [assignments, setAssignments] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [errorMsg, setErrorMsg] = useState("");
  const [collapsedGroups, setCollapsedGroups] = useState({});
  const [bulkFormGroups, setBulkFormGroups] = useState({});
  const [busyGroups, setBusyGroups] = useState({});
  const [attendance, setAttendance] = useState([]);
  const [courses, setCourses] = useState([]);
  const [courseAttendance, setCourseAttendance] = useState([]);
  const [selectedStudentId, setSelectedStudentId] = useState(null);
  const [history, setHistory] = useState([]);
  const [historyLoading, setHistoryLoading] = useState(false);
  const [workLogs, setWorkLogs] = useState([]);
  const [workLogsLoading, setWorkLogsLoading] = useState(false);

  const loadAll = useCallback(async () => {
    setErrorMsg("");
    const [studentsRes, extraRes, logsRes, assignRes, attnRes, coursesRes, courseAttnRes] = await Promise.all([
      supabaseClient.from("attn_students").select("id,name,school,grade,class,days,clinic,clinic_days,clinic_time,regular_time,enroll_date").neq("status", "퇴원").order("name"),
      supabaseClient.from("attn_extra_roster").select("student_id,scheduled_time,plan_note").eq("attn_date", selectedDate),
      supabaseClient.from("clm_class_logs").select("*").eq("class_date", selectedDate),
      supabaseClient.from("clm_assignments").select("id,student_id,description,status,teacher_comment,student_note,due_date").eq("class_date", selectedDate),
      supabaseClient.from("attn_attendance").select("student_id,session,status").eq("attn_date", selectedDate),
      supabaseClient.from("attn_student_courses").select("id,student_id,course_name,days,start_date,end_date"),
      supabaseClient.from("attn_course_attendance").select("course_id,status").eq("attn_date", selectedDate),
    ]);
    if (studentsRes.error || extraRes.error || logsRes.error || assignRes.error || attnRes.error || coursesRes.error || courseAttnRes.error) {
      setErrorMsg("데이터를 불러오는 중 문제가 생겼어요. 새로고침 해보세요.");
    }
    setStudents(studentsRes.data || []);
    setExtraRows(extraRes.data || []);
    setClassLogs(logsRes.data || []);
    setAssignments(assignRes.data || []);
    setAttendance(attnRes.data || []);
    setCourses(coursesRes.data || []);
    setCourseAttendance(courseAttnRes.data || []);
    setLoaded(true);
  }, [selectedDate]);

  useEffect(() => { loadAll(); }, [loadAll]);

  useEffect(() => {
    const channel = supabaseClient
      .channel(`clm_class_log_${selectedDate}`)
      .on("postgres_changes", { event: "*", schema: "public", table: "clm_class_logs", filter: `class_date=eq.${selectedDate}` }, () => loadAll())
      .on("postgres_changes", { event: "*", schema: "public", table: "clm_assignments", filter: `class_date=eq.${selectedDate}` }, () => loadAll())
      .on("postgres_changes", { event: "*", schema: "public", table: "attn_extra_roster", filter: `attn_date=eq.${selectedDate}` }, () => loadAll())
      .on("postgres_changes", { event: "*", schema: "public", table: "attn_attendance", filter: `attn_date=eq.${selectedDate}` }, () => loadAll())
      .on("postgres_changes", { event: "*", schema: "public", table: "attn_course_attendance", filter: `attn_date=eq.${selectedDate}` }, () => loadAll())
      .subscribe();
    return () => { supabaseClient.removeChannel(channel); };
  }, [selectedDate, loadAll]);

  const extraMap = useMemo(() => {
    const m = {};
    extraRows.forEach((r) => { m[r.student_id] = { time: r.scheduled_time || "", note: r.plan_note || "" }; });
    return m;
  }, [extraRows]);

  const weekday = korWeekdayOfDate(selectedDate);
  const roster = useMemo(() => {
    if (activeSession === "extra") {
      return students.filter((s) => extraMap[s.id]);
    }
    return students.filter((s) => {
      if (s.enroll_date && selectedDate < s.enroll_date) return false;
      if (activeSession === "clinic") {
        if (s.clinic === false) return false;
        const clinicDays = (s.clinic_days && s.clinic_days.length > 0) ? s.clinic_days : (s.days || []);
        return clinicDays.includes(weekday);
      }
      return (s.days || []).includes(weekday);
    });
  }, [students, extraMap, activeSession, selectedDate, weekday]);

  const groups = useMemo(() => {
    if (groupMode === "class") return groupRosterByClassName(roster);
    if (groupMode === "grade") return buildStudentGroups("grade", roster, [], []);
    return null;
  }, [groupMode, roster]);

  const attendanceFor = (studentId) => {
    const row = attendance.find((a) => a.student_id === studentId && a.session === activeSession);
    return row ? row.status : null;
  };

  // 특강(추가강좌) 현황 - attn_student_courses의 요일(days)·기간(start_date~end_date)으로 그날 그 학생이
  // 듣는 특강을 골라내고, attn_course_attendance에서 그 강좌의 오늘 출결상태를 붙인다.
  const courseStatusFor = (courseId) => {
    const row = courseAttendance.find((a) => a.course_id === courseId);
    return row ? row.status : null;
  };
  const coursesForStudentToday = (studentId) => courses
    .filter((c) => c.student_id === studentId && (c.days || []).includes(weekday)
      && (!c.start_date || c.start_date <= selectedDate) && (!c.end_date || c.end_date >= selectedDate))
    .map((c) => {
      const status = courseStatusFor(c.id);
      return { id: c.id, courseName: c.course_name, status, meta: status ? CLASS_LOG_ATTN_STATUS[status] : null };
    });

  // 왼쪽 목록에서 학생을 고르면 오른쪽에 상세가 뜨는 구조 - 목록이 바뀌면(날짜/세션 변경 등)
  // 선택된 학생이 더 이상 목록에 없을 때만 첫 번째 학생으로 다시 골라준다.
  useEffect(() => {
    if (roster.length === 0) { setSelectedStudentId(null); return; }
    if (!roster.some((s) => s.id === selectedStudentId)) {
      setSelectedStudentId(roster[0].id);
    }
  }, [roster, selectedStudentId]);

  const selectedStudent = roster.find((s) => s.id === selectedStudentId) || null;

  // 학습현황 카드용 - 선택된 학생의 최근 과제 이력을 날짜와 무관하게 최신순으로 몇 건만 가져온다.
  useEffect(() => {
    if (!selectedStudentId) { setHistory([]); return; }
    let cancelled = false;
    setHistoryLoading(true);
    supabaseClient.from("clm_assignments").select("id,description,status,due_date,class_date")
      .eq("student_id", selectedStudentId).order("class_date", { ascending: false }).limit(5)
      .then(({ data, error }) => {
        if (cancelled) return;
        setHistory(error ? [] : (data || []));
        setHistoryLoading(false);
      });
    return () => { cancelled = true; };
  }, [selectedStudentId]);

  // 근무일지 연동 카드용 - attendance.html의 "학생 이름 옆 📔 버튼 → 그 학생 근무일지만 필터링" 화면과
  // 같은 방식으로, student_ids 배열에 선택된 학생이 포함된 최근 근무일지 몇 건을 읽기 전용으로 가져온다.
  // (수정/작성은 attendance.html의 근무일지 화면에서만 — 여기서는 보기만 지원)
  useEffect(() => {
    if (!selectedStudentId) { setWorkLogs([]); return; }
    let cancelled = false;
    setWorkLogsLoading(true);
    supabaseClient.from("attn_work_logs").select("id,log_date,author_name,author_email,content")
      .contains("student_ids", [selectedStudentId]).order("log_date", { ascending: false }).limit(5)
      .then(({ data, error }) => {
        if (cancelled) return;
        setWorkLogs(error ? [] : (data || []));
        setWorkLogsLoading(false);
      });
    return () => { cancelled = true; };
  }, [selectedStudentId]);

  const noteFor = (studentId) => {
    const row = classLogs.find((l) => l.student_id === studentId && l.session === activeSession);
    return (row && row.lesson_note) || "";
  };

  const saveNote = async (studentId, value) => {
    const { error } = await supabaseClient.from("clm_class_logs").upsert({
      student_id: studentId, class_date: selectedDate, session: activeSession,
      lesson_note: value || null, created_by: session.user.email, updated_at: new Date().toISOString(),
    }, { onConflict: "student_id,class_date,session" });
    if (error) { setErrorMsg("수업내용 저장에 실패했어요: " + error.message); return; }
    await loadAll();
  };

  // 과제는 학생 한 명에게 하루에 여러 건 있을 수 있어서(과목별로 따로, 또는 수업 중 추가로 더 내주는 경우)
  // 단일 값이 아니라 배열로 돌려준다.
  const assignmentsFor = (studentId) => assignments.filter((a) => a.student_id === studentId);

  const createAssignment = async (s, description, dueDate) => {
    const { error } = await supabaseClient.from("clm_assignments").insert({
      student_id: s.id, class_date: selectedDate, description, due_date: dueDate, created_by: session.user.email,
    });
    if (error) { setErrorMsg("과제 추가에 실패했어요: " + error.message); return; }
    await loadAll();
  };

  const updateAssignmentDescription = async (assignmentId, description) => {
    const { error } = await supabaseClient.from("clm_assignments").update({ description }).eq("id", assignmentId);
    if (error) { setErrorMsg("과제 수정에 실패했어요: " + error.message); return; }
    await loadAll();
  };

  const deleteAssignmentRow = async (assignmentId) => {
    const { error } = await supabaseClient.from("clm_assignments").delete().eq("id", assignmentId);
    if (error) { setErrorMsg("과제 삭제에 실패했어요: " + error.message); return; }
    await loadAll();
  };

  const toggleBulkForm = (key) => setBulkFormGroups((prev) => ({ ...prev, [key]: !prev[key] }));

  const assignGroup = async (groupKey, items, description, dueDate) => {
    // 과제는 여러 건 있을 수 있으므로, 이미 과제가 있는 학생도 제외하지 않고 그룹 전체에 새 과제를 추가한다.
    if (items.length === 0) { toggleBulkForm(groupKey); return; }
    setBusyGroups((b) => ({ ...b, [groupKey]: true }));
    try {
      const payload = items.map((s) => ({
        student_id: s.id, class_date: selectedDate, description, due_date: dueDate, created_by: session.user.email,
      }));
      const { error } = await supabaseClient.from("clm_assignments").insert(payload);
      if (error) { setErrorMsg("그룹 배정에 실패했어요: " + error.message); return; }
      setBulkFormGroups((b) => { const n = { ...b }; delete n[groupKey]; return n; });
      await loadAll();
    } finally {
      setBusyGroups((b) => { const n = { ...b }; delete n[groupKey]; return n; });
    }
  };

  const toggleGroupCollapsed = (key) => setCollapsedGroups((prev) => ({ ...prev, [key]: !prev[key] }));

  const renderRosterRow = (s, isLast) => h(ClassLogRosterRow, {
    key: s.id, s, isLast, active: s.id === selectedStudentId, onClick: () => setSelectedStudentId(s.id),
    hasNote: !!noteFor(s.id), hasAssignment: assignmentsFor(s.id).length > 0, attnStatus: attendanceFor(s.id),
    hasCourse: coursesForStudentToday(s.id).length > 0,
  });

  if (!loaded) return h("div", { style: { color: SUBINK, fontSize: 13, padding: "40px 0", textAlign: "center" } }, "불러오는 중...");

  const selectedAssignments = selectedStudent ? assignmentsFor(selectedStudent.id) : [];
  const selectedDoneCount = selectedAssignments.filter((a) => a.status === "제출완료").length;
  const selectedAttnStatus = selectedStudent ? attendanceFor(selectedStudent.id) : null;
  const selectedAttnMeta = selectedAttnStatus ? CLASS_LOG_ATTN_STATUS[selectedAttnStatus] : null;
  const selectedCourses = selectedStudent ? coursesForStudentToday(selectedStudent.id) : [];

  return h("div", null,
    errorMsg && h("div", { className: "rounded-xl px-4 py-2.5 mb-4", style: { background: RED_SOFT, color: RED, fontSize: 12.5, fontWeight: 600 } }, errorMsg),

    h("div", { className: "flex flex-col lg:flex-row gap-4 items-start" },

      // 왼쪽 패널: 날짜/요일, 정규수업·클리닉·보강 탭, 그루핑, 학생목록.
      h("div", { className: "w-full lg:w-72 flex-shrink-0 flex flex-col gap-3" },
        h("div", { className: "flex items-center justify-between flex-wrap gap-2" },
          h("input", { type: "date", value: selectedDate, onChange: (e) => setSelectedDate(e.target.value),
            className: "px-3 py-2 rounded-lg text-sm outline-none flex-1", style: { border: `1px solid ${LINE}`, background: "#fff" } }),
          h("span", { style: { fontSize: 12.5, fontWeight: 800, color: NAVY, background: NAVY_SOFT, borderRadius: 8, padding: "6px 10px", flexShrink: 0 } }, weekday, "요일")
        ),

        h("div", { className: "grid grid-cols-3 gap-1.5 p-1.5 rounded-2xl", style: { background: "#fff", border: `1px solid ${LINE}` } },
          CLASS_LOG_SESSION_ORDER.map((key) => h("button", { key, type: "button", onClick: () => setActiveSession(key),
            className: "px-2 py-2 rounded-xl text-xs font-semibold",
            style: { background: activeSession === key ? NAVY : "transparent", color: activeSession === key ? "#fff" : SUBINK } },
            CLASS_LOG_SESSIONS[key]))
        ),

        h("div", { style: { fontSize: 11, fontWeight: 800, color: SUBINK } }, "그루핑"),
        h("div", { className: "flex items-center gap-1.5 flex-wrap" },
          CLASS_LOG_GROUP_MODES.map((m) =>
            h("button", { key: m.key, type: "button", onClick: () => setGroupMode(m.key),
              className: "px-3 py-1.5 rounded-lg text-xs font-bold",
              style: { background: groupMode === m.key ? NAVY : "#fff", color: groupMode === m.key ? "#fff" : SUBINK, border: `1px solid ${groupMode === m.key ? NAVY : LINE}` } },
              m.label)
          )
        ),

        roster.length === 0
          ? h("div", { className: "rounded-2xl p-6 text-center", style: { background: "#fff", border: `1px solid ${LINE}`, color: SUBINK, fontSize: 12.5 } },
              activeSession === "extra" ? "오늘 등록된 보강 학생이 없어요. 출결체크 화면에서 먼저 등록해주세요." : `${weekday}요일 ${CLASS_LOG_SESSIONS[activeSession]}에 배정된 학생이 없어요.`)
          : groupMode === "none"
            ? h("div", { className: "rounded-2xl overflow-hidden", style: { background: "#fff", border: `1px solid ${LINE}`, maxHeight: 560, overflowY: "auto" } },
                roster.map((s, idx) => renderRosterRow(s, idx === roster.length - 1))
              )
            : h("div", { style: { maxHeight: 600, overflowY: "auto" } },
                (groups || []).map((g) => h(ClassLogGroupSection, {
                  key: g.label, group: g, collapsed: !!collapsedGroups[g.label],
                  onToggleCollapsed: () => toggleGroupCollapsed(g.label), renderRow: renderRosterRow,
                  bulkFormOpen: !!bulkFormGroups[g.label], onToggleBulkForm: () => toggleBulkForm(g.label),
                  onConfirmBulkAssign: (desc, due) => assignGroup(g.label, g.items, desc, due),
                  groupBusy: !!busyGroups[g.label],
                }))
              )
      ),

      // 오른쪽 패널: 선택된 학생의 출결·과제·특강현황 카드 + 수업내용/과제 입력 + 학습현황 + 근무일지.
      h("div", { className: "flex-1 min-w-0 w-full flex flex-col gap-3" },
        !selectedStudent
          ? h("div", { className: "rounded-2xl p-10 text-center", style: { background: "#fff", border: `1px solid ${LINE}`, color: SUBINK, fontSize: 13 } },
              "왼쪽 목록에서 학생을 선택해주세요.")
          : h(React.Fragment, null,
              h("div", { key: "header", className: "rounded-2xl p-4 flex items-center gap-3", style: { background: "#fff", border: `1px solid ${LINE}` } },
                h("div", { style: { width: 40, height: 40, borderRadius: 12, background: NAVY_SOFT, color: NAVY, fontWeight: 800, fontSize: 15 }, className: "flex items-center justify-center flex-shrink-0" }, selectedStudent.name.slice(0, 1)),
                h("div", null,
                  h("div", { style: { fontWeight: 800, fontSize: 15, color: INK } }, selectedStudent.name),
                  h("div", { style: { fontSize: 11.5, color: SUBINK } },
                    [selectedStudent.school, selectedStudent.grade ? selectedStudent.grade + "학년" : "", selectedStudent.class].filter(Boolean).join(" · ") || "정보 미등록")
                )
              ),

              h("div", { key: "stats", className: "grid grid-cols-2 gap-3 mt-3" },
                h("div", { className: "rounded-2xl p-4", style: { background: selectedAttnMeta ? selectedAttnMeta.soft : "#fff", border: `1px solid ${selectedAttnMeta ? selectedAttnMeta.color : LINE}` } },
                  h("div", { style: { fontSize: 11, fontWeight: 700, color: SUBINK, marginBottom: 4 } }, "출결현황 · ", CLASS_LOG_SESSIONS[activeSession]),
                  h("div", { style: { fontSize: 16, fontWeight: 800, color: selectedAttnMeta ? selectedAttnMeta.color : SUBINK } }, selectedAttnStatus || "미체크")
                ),
                h("div", { className: "rounded-2xl p-4", style: {
                    background: selectedAssignments.length === 0 ? "#fff" : (selectedDoneCount === selectedAssignments.length ? TEAL_SOFT : AMBER_SOFT),
                    border: `1px solid ${selectedAssignments.length === 0 ? LINE : (selectedDoneCount === selectedAssignments.length ? TEAL : AMBER)}`,
                  } },
                  h("div", { style: { fontSize: 11, fontWeight: 700, color: SUBINK, marginBottom: 4 } }, "오늘 과제"),
                  h("div", { style: { fontSize: 16, fontWeight: 800, color: selectedAssignments.length === 0 ? SUBINK : (selectedDoneCount === selectedAssignments.length ? TEAL : AMBER) } },
                    selectedAssignments.length === 0 ? "배정 없음" : `${selectedAssignments.length}건 · ${selectedDoneCount}건 제출완료`)
                )
              ),

              selectedCourses.length > 0 && h("div", { key: "courses", className: "flex items-center gap-2 flex-wrap mt-1" },
                selectedCourses.map((c) => h("span", { key: c.id,
                  style: { fontSize: 11, fontWeight: 700, color: c.meta ? c.meta.color : SUBINK, background: c.meta ? c.meta.soft : PAPER, borderRadius: 6, padding: "3px 9px" } },
                  "🎓 특강 · ", c.courseName, " (", c.status || "미체크", ")"))
              ),

              h("div", { key: "editor", className: "rounded-2xl p-4 mt-3", style: { background: "#fff", border: `1px solid ${LINE}` } },
                h(ClassLogRow, {
                  s: selectedStudent, note: noteFor(selectedStudent.id), onSaveNote: (v) => saveNote(selectedStudent.id, v),
                  assignments: selectedAssignments,
                  onCreateAssignment: createAssignment, onUpdateAssignment: updateAssignmentDescription, onDeleteAssignment: deleteAssignmentRow,
                })
              ),

              h("div", { key: "history", className: "rounded-2xl p-4 mt-3", style: { background: "#fff", border: `1px solid ${LINE}` } },
                h("div", { style: { fontSize: 11.5, fontWeight: 800, color: SUBINK, marginBottom: 8 } }, "학습현황 · 최근 과제 이력"),
                historyLoading
                  ? h("div", { style: { fontSize: 12, color: SUBINK } }, "불러오는 중...")
                  : history.length === 0
                    ? h("div", { style: { fontSize: 12, color: SUBINK } }, "아직 과제 이력이 없어요.")
                    : h("div", { className: "flex flex-col gap-2" },
                        history.map((a) => h("div", { key: a.id, className: "flex items-center justify-between gap-2 flex-wrap", style: { fontSize: 12 } },
                          h("div", { style: { color: INK, flex: "1 1 160px" } }, a.description),
                          h("div", { className: "flex items-center gap-2 flex-shrink-0" },
                            h("span", { style: { color: SUBINK } }, a.class_date),
                            h("span", { style: { fontWeight: 700, color: a.status === "제출완료" ? TEAL : AMBER } }, a.status === "제출완료" ? "제출완료" : "미제출")
                          )
                        ))
                      )
              ),

              h("div", { key: "worklog", className: "rounded-2xl p-4 mt-3", style: { background: "#fff", border: `1px solid ${LINE}` } },
                h("div", { style: { fontSize: 11.5, fontWeight: 800, color: SUBINK, marginBottom: 8 } }, "📔 근무일지 · 최근 기록 (읽기 전용)"),
                workLogsLoading
                  ? h("div", { style: { fontSize: 12, color: SUBINK } }, "불러오는 중...")
                  : workLogs.length === 0
                    ? h("div", { style: { fontSize: 12, color: SUBINK } }, "이 학생에 대해 작성된 근무일지가 아직 없어요.")
                    : h("div", { className: "flex flex-col gap-2.5" },
                        workLogs.map((w) => h("div", { key: w.id, style: { fontSize: 12 } },
                          h("div", { className: "flex items-center gap-2 flex-wrap", style: { marginBottom: 2 } },
                            h("span", { style: { fontWeight: 700, color: NAVY } }, w.log_date),
                            h("span", { style: { color: SUBINK } }, w.author_name || w.author_email)
                          ),
                          h("div", { style: { color: INK } }, w.content)
                        ))
                      )
              )
            )
      )
    )
  );
}

// ============================================================
// Main app (attendance.html과 동일한 사이드바/모바일 내비 구조)
// ============================================================
const TAB_DEFS = [
  { key: "textbooks", label: "교재별 진도", icon: "📘", ready: true },
  { key: "assignments", label: "과제 관리", icon: "📝", ready: true },
  { key: "classlog", label: "수업일지", icon: "📓", ready: true, directorOnly: true },
  { key: "questions", label: "질문 (준비중)", icon: "💬", ready: false },
];
const TAB_HEADERS = {
  textbooks: { title: "교재별 진도", subtitle: "학생별 · 교재별로 진도를 등록하고 관리하세요." },
  assignments: { title: "과제 관리", subtitle: "과제를 등록하고, 학생이 제출한 내용을 확인·코멘트하세요." },
  classlog: { title: "수업일지", subtitle: "왼쪽에서 학생을 고르면 오른쪽에서 출결·과제·특강현황을 보며 수업내용/과제를 바로 기록할 수 있어요." },
};
const LAST_TAB_KEY = "clm_last_tab";

function MainApp({ session }) {
  const role = session.user.app_metadata && session.user.app_metadata.role === "director" ? "director" : "assistant";
  const isDirector = role === "director";
  // 수업일지처럼 원장님 전용 탭은 조교 계정에는 아예 목록에서 숨김.
  const visibleTabs = useMemo(() => TAB_DEFS.filter((t) => !t.directorOnly || isDirector), [isDirector]);

  const [tab, setTab] = useState(() => {
    try {
      const saved = sessionStorage.getItem(LAST_TAB_KEY);
      return saved && visibleTabs.some((t) => t.key === saved && t.ready) ? saved : "textbooks";
    } catch (e) { return "textbooks"; }
  });
  useEffect(() => { try { sessionStorage.setItem(LAST_TAB_KEY, tab); } catch (e) {} }, [tab]);

  const handleLogout = () => {
    try { sessionStorage.removeItem(LAST_TAB_KEY); } catch (e) {}
    supabaseClient.auth.signOut();
  };

  const navItem = (t, mobile) => h("button", {
    key: t.key,
    disabled: !t.ready,
    onClick: () => t.ready && setTab(t.key),
    className: mobile
      ? "flex-1 flex flex-col items-center gap-0.5 py-2.5 text-[11px] font-semibold"
      : "flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-sm font-semibold text-left transition-colors",
    style: mobile
      ? { color: tab === t.key ? NAVY : SUBINK, opacity: t.ready ? 1 : 0.45 }
      : { background: tab === t.key ? NAVY_SOFT : "transparent", color: tab === t.key ? NAVY : SUBINK, opacity: t.ready ? 1 : 0.45, cursor: t.ready ? "pointer" : "default" },
  },
    h("span", { style: { fontSize: mobile ? 17 : 15 } }, t.icon),
    t.label
  );

  // 왼쪽 세로 사이드바 대신 맨 위에 가로 탭으로 - 화면 폭을 더 넓게 쓸 수 있게(원장님 요청, 2026-08-01).
  // 모바일은 기존처럼 mobileHeader + 하단 mobileNav 그대로 유지.
  const desktopHeader = h("header", { className: "hidden md:flex sticky top-0 z-20 items-center gap-4 px-6 py-3 flex-wrap", style: { background: "#fff", borderBottom: `1px solid ${LINE}` } },
    h("img", { src: LOGO_HORIZONTAL, alt: "올곧수학", style: { height: 24 }, className: "flex-shrink-0" }),
    h("nav", { className: "flex items-center gap-1 flex-1 flex-wrap" }, visibleTabs.map((t) => navItem(t, false))),
    h("div", { className: "flex items-center gap-3 flex-shrink-0" },
      h("div", { style: { fontSize: 12, fontWeight: 700, color: INK, maxWidth: 160, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" } }, session.user.email),
      h("div", { className: "flex items-center gap-1.5", style: { color: "#22c55e", fontSize: 11 } },
        h("span", { style: { width: 6, height: 6, borderRadius: 999, background: "#22c55e", display: "inline-block" } }),
        h("span", { style: { color: SUBINK } }, "실시간 동기화")
      ),
      h("button", { onClick: handleLogout, className: "py-2 px-3 rounded-lg text-xs font-bold", style: { background: PAPER, color: SUBINK } }, "로그아웃")
    )
  );

  const mobileHeader = h("header", { className: "md:hidden sticky top-0 z-20 flex items-center justify-between px-4 py-3", style: { background: "#fff", borderBottom: `1px solid ${LINE}` } },
    h("img", { src: LOGO_HORIZONTAL, alt: "올곧수학", style: { height: 24 } }),
    h("button", { onClick: handleLogout, style: { color: SUBINK, fontSize: 12, fontWeight: 700, background: PAPER, padding: "6px 10px", borderRadius: 8 } }, "로그아웃")
  );

  const mobileNav = h("nav", { className: "md:hidden fixed bottom-0 inset-x-0 z-20 flex", style: { background: "#fff", borderTop: `1px solid ${LINE}` } },
    visibleTabs.map((t) => navItem(t, true))
  );

  const headerInfo = TAB_HEADERS[tab] || TAB_HEADERS.textbooks;
  const pageHeader = h("div", { className: "mb-5" },
    h("h1", { style: { fontSize: 20, fontWeight: 800, marginBottom: 2, color: INK } }, headerInfo.title),
    h("p", { style: { color: SUBINK, fontSize: 13 } }, headerInfo.subtitle)
  );

  return h("div", { style: { background: PAPER, color: INK, minHeight: "100vh" } },
    desktopHeader,
    mobileHeader,
    h("div", { className: "max-w-6xl mx-auto px-4 sm:px-6 py-6 pb-24 md:pb-10" },
      pageHeader,
      tab === "textbooks" && h(TextbookDashboard, { session, role }),
      tab === "assignments" && h(AssignmentsDashboard, { session, role }),
      tab === "classlog" && isDirector && h(ClassLogDashboard, { session })
    ),
    mobileNav
  );
}

// ============================================================
// Root
// ============================================================
function App() {
  const [session, setSession] = useState(undefined);

  useEffect(() => {
    supabaseClient.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: listener } = supabaseClient.auth.onAuthStateChange((_event, sess) => setSession(sess));
    return () => listener.subscription.unsubscribe();
  }, []);

  if (session === undefined) {
    return h("div", { style: { background: PAPER, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: SUBINK, fontSize: 13 } }, "확인 중...");
  }
  if (!session) return h(LoginScreen);
  return h(MainApp, { session });
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
