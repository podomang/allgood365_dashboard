const WEEKDAYS_MON_FIRST = ["월", "화", "수", "목", "금", "토", "일"];
const JS_DAY_TO_KOR = ["일", "월", "화", "수", "목", "금", "토"];
function fmt(d) {
    const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
}
function todayStr() { return fmt(new Date()); }
function addDays(dateStr, delta) {
    const d = new Date(dateStr + "T00:00:00");
    d.setDate(d.getDate() + delta);
    return fmt(d);
}
function korWeekdayOf(dateStr) {
    return JS_DAY_TO_KOR[new Date(dateStr + "T00:00:00").getDay()];
}

function LoginScreen() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [showPassword, setShowPassword] = useState(false);
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  const submit = async (e) => {
    e.preventDefault();
    setError("");
    setLoading(true);
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    setLoading(false);
    if (error) setError("이메일 또는 비밀번호가 올바르지 않습니다.");
  };
  return h("div", { style: { background: PAPER, minHeight: "100vh" }, className: "flex items-center justify-center px-4" },
    h("div", { className: "w-full max-w-sm rounded-2xl p-6", style: { background: "#fff", border: `1px solid ${LINE}` } },
      h("img", { src: LOGO_HORIZONTAL, alt: "올곧수학 더센텀", style: { height: 34, margin: "0 auto 20px", display: "block" } }),
      h("div", { style: { fontWeight: 800, fontSize: 15, textAlign: "center", marginBottom: 18, color: INK } }, "홈 로그인"),
      h("form", { onSubmit: submit, className: "flex flex-col gap-3" },
        h("input", { type: "email", required: true, value: email, onChange: (e) => setEmail(e.target.value), placeholder: "이메일", className: "px-3 py-3 rounded-lg text-sm outline-none", style: { border: `1px solid ${LINE}` } }),
        h("div", { style: { position: "relative" } },
          h("input", { type: showPassword ? "text" : "password", required: true, value: password, onChange: (e) => setPassword(e.target.value), placeholder: "비밀번호", className: "w-full px-3 py-3 rounded-lg text-sm outline-none", style: { border: `1px solid ${LINE}`, paddingRight: 42 } }),
          h("button", { type: "button", onClick: () => setShowPassword((v) => !v), "aria-label": showPassword ? "비밀번호 숨기기" : "비밀번호 보이기", style: { position: "absolute", right: 2, top: "50%", transform: "translateY(-50%)", width: 36, height: 36, display: "flex", alignItems: "center", justifyContent: "center", color: SUBINK, background: "transparent" } }, h(EyeIcon, { off: showPassword }))
        ),
        error && h("div", { style: { color: RED, fontSize: 12.5, fontWeight: 600 } }, error),
        h("button", { type: "submit", disabled: loading, className: "py-3 rounded-lg text-sm font-bold mt-1", style: { background: NAVY, color: "#fff", opacity: loading ? 0.6 : 1 } }, loading ? "로그인 중..." : "로그인")
      ),
      h("div", { style: { fontSize: 11.5, color: SUBINK, marginTop: 14, textAlign: "center" } }, "계정이 없다면 원장님께 문의하세요.")
    )
  );
}


// ============================================================
// 학원운영관리 - 급여 정산 / 시급 관리 (2026-10-31 신설, 원장·실장 director 권한 전용)
// 데이터는 전부 Supabase 쪽에서 계산·보호한다:
//  - attn_pay_rates        : 조교별 시급 이력(적용 시작일 기준). director만 읽기/쓰기 가능(RLS) → 조교는 시급 열람 불가.
//  - payroll_days(y, m)    : 일별 근무시간(분 단위 내림)·적용 시급·금액·이상기록. director가 아니면 에러.
//  - payroll_month(y, m)   : 위 일별 내역을 조교별로 합산(공제 3.3% 후 100원 단위 절상).
//  - attn_payroll_settlements : 월별 정산 확정 기록. director만 접근.
// 화면은 이 결과를 보여주고, 확정 저장·엑셀 내려받기만 한다(계산 규칙을 화면에 중복으로 두지 않음).
// ============================================================
const KOR_DAY = ["일", "월", "화", "수", "목", "금", "토"];
function won(n) { return (Math.round(Number(n) || 0)).toLocaleString("ko-KR") + "원"; }
function hm(mins) { const m = Math.max(0, Number(mins) || 0); return `${Math.floor(m / 60)}시간 ${String(m % 60).padStart(2, "0")}분`; }
function slashDate(d) { return d.replaceAll("-", "/"); }
function korDayOf(d) { return KOR_DAY[new Date(d + "T00:00:00").getDay()]; }
function seoulToday() {
    const parts = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
    return parts; // YYYY-MM-DD
}
// 기본 정산월: 매월 10일까지는 지난달(전월 정산 기간), 그 이후는 이번 달
function defaultYM() {
    const [y, m, d] = seoulToday().split("-").map(Number);
    if (d <= 10) return m === 1 ? { y: y - 1, m: 12 } : { y, m: m - 1 };
    return { y, m };
}
function shiftYM(ym, delta) {
    const idx = ym.y * 12 + (ym.m - 1) + delta;
    return { y: Math.floor(idx / 12), m: (idx % 12) + 1 };
}
function monthEnded(ym) {
    const last = new Date(ym.y, ym.m, 0);
    const lastStr = `${ym.y}-${String(ym.m).padStart(2, "0")}-${String(last.getDate()).padStart(2, "0")}`;
    return seoulToday() > lastStr;
}

async function fetchPayroll(ym) {
    const [sum, days, sets] = await Promise.all([
        supabaseClient.rpc("payroll_month", { p_year: ym.y, p_month: ym.m }),
        supabaseClient.rpc("payroll_days", { p_year: ym.y, p_month: ym.m }),
        supabaseClient.from("attn_payroll_settlements").select("*").eq("year", ym.y).eq("month", ym.m),
    ]);
    const err = sum.error || days.error || sets.error;
    if (err) throw err;
    return { summary: sum.data || [], days: days.data || [], settlements: sets.data || [] };
}
async function saveSettlements(ym, summary, email) {
    const now = new Date().toISOString();
    const rows = summary.map((r) => ({
        year: ym.y, month: ym.m, assistant_id: r.assistant_id,
        work_days: r.work_days, work_minutes: r.work_minutes,
        gross_amount: r.gross_amount, after_deduction: r.after_deduction, pay_amount: r.pay_amount,
        confirmed_by: email, confirmed_at: now,
    }));
    const { error } = await supabaseClient.from("attn_payroll_settlements").upsert(rows, { onConflict: "year,month,assistant_id" });
    if (error) throw error;
}

// ---------------- 엑셀 내려받기 (기존 "올곧수학 조교 월별 근무 현황 및 급여명세서" 시트 양식) ----------------
async function downloadPayrollExcel(ym, summary, days) {
    if (!window.ExcelJS) { alert("엑셀 모듈을 불러오지 못했어요. 새로고침 후 다시 시도해 주세요."); return; }
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet(`${String(ym.y).slice(2)}년 ${ym.m}월`);
    const thin = { style: "thin" }, med = { style: "medium" };
    const center = { vertical: "middle", horizontal: "center" };
    const box = (r1, c1, r2, c2) => {
        for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) {
            ws.getCell(r, c).border = { left: c === c1 ? med : thin, right: c === c2 ? med : thin, top: r === r1 ? med : thin, bottom: r === r2 ? med : thin };
        }
    };
    const byName = {};
    days.forEach((d) => { (byName[d.assistant_id] = byName[d.assistant_id] || []).push(d); });
    const maxRows = Math.max(1, ...summary.map((s) => (byName[s.assistant_id] || []).length));
    const lastDataRow = 3 + maxRows;
    const boxRow = lastDataRow + 3;
    summary.forEach((s, i) => {
        const c0 = 2 + i * 5; // B, G, L, Q ...
        [0, 1, 2, 3].forEach((k) => { ws.getColumn(c0 + k).width = [13, 6, 14, 13][k]; });
        ws.mergeCells(2, c0, 2, c0 + 3);
        Object.assign(ws.getCell(2, c0), { value: `${ym.m}월 근무 · ${s.name}`, alignment: center, font: { bold: true, size: 13 } });
        ["날짜", "요일", "근/퇴", "근무시간"].forEach((t, k) => Object.assign(ws.getCell(3, c0 + k), { value: t, alignment: center, font: { bold: true } }));
        (byName[s.assistant_id] || []).forEach((d, j) => {
            const r = 4 + j;
            const [yy, mm, dd] = d.work_date.split("-").map(Number);
            Object.assign(ws.getCell(r, c0), { value: new Date(Date.UTC(yy, mm - 1, dd)), numFmt: "yyyy/mm/dd", alignment: center });
            Object.assign(ws.getCell(r, c0 + 1), { value: korDayOf(d.work_date), alignment: center });
            Object.assign(ws.getCell(r, c0 + 2), { value: `${d.check_in_time || ""}~${d.check_out_time || ""}`, alignment: center });
            Object.assign(ws.getCell(r, c0 + 3), { value: hm(d.minutes) + (d.issue ? "*" : ""), alignment: center });
        });
        box(2, c0, lastDataRow, c0 + 3);
        ws.mergeCells(boxRow, c0, boxRow + 2, c0 + 1);
        Object.assign(ws.getCell(boxRow, c0), { value: `조교 ${s.name}`, alignment: center, font: { bold: true, size: 14 } });
        const lines = [["합(시간)", hm(s.work_minutes)], ["급여(원)", won(s.gross_amount)], [`(시급 ${s.hourly_rates}원, 공제 3.3%)`, ""], ["실지급", won(s.pay_amount)]];
        lines.forEach(([l, v], k) => {
            Object.assign(ws.getCell(boxRow + k, c0 + 2), { value: l, alignment: center, font: k === 2 ? { bold: true, size: 8 } : {} });
            Object.assign(ws.getCell(boxRow + k, c0 + 3), { value: v, alignment: center, font: k === 3 ? { bold: true } : {} });
        });
        box(boxRow, c0, boxRow + 3, c0 + 3);
    });
    let r = boxRow + 6;
    ws.getCell(r, 2).value = `${ym.m}월 급여 정산`; ws.getCell(r, 2).font = { bold: true };
    r++;
    const t1 = r;
    ["조교", "공제 후 정산금액", "실지급액"].forEach((t, k) => Object.assign(ws.getCell(r, 2 + k), { value: t, alignment: center, font: { bold: true } }));
    let totA = 0, totP = 0;
    summary.forEach((s) => {
        r++; totA += Number(s.after_deduction); totP += s.pay_amount;
        ws.getCell(r, 2).value = s.name;
        Object.assign(ws.getCell(r, 3), { value: won(s.after_deduction), alignment: { horizontal: "right" } });
        Object.assign(ws.getCell(r, 4), { value: won(s.pay_amount), alignment: { horizontal: "right" }, font: { bold: true } });
    });
    r++;
    ws.getCell(r, 2).value = "합계"; ws.getCell(r, 2).font = { bold: true };
    Object.assign(ws.getCell(r, 3), { value: won(totA), alignment: { horizontal: "right" } });
    Object.assign(ws.getCell(r, 4), { value: won(totP), alignment: { horizontal: "right" }, font: { bold: true } });
    box(t1, 2, r, 4);
    ws.getCell(r + 1, 4).value = "참고 : 100원 단위 절상"; ws.getCell(r + 1, 4).font = { size: 9 };
    r += 3;
    const t2 = r;
    ["조교", "총 근무시간", "주당 평균 근로시간", "근무일수"].forEach((t, k) => Object.assign(ws.getCell(r, 2 + k), { value: t, alignment: center, font: { bold: true } }));
    const weeks = new Date(ym.y, ym.m, 0).getDate() / 7;
    summary.forEach((s) => {
        r++;
        ws.getCell(r, 2).value = s.name;
        Object.assign(ws.getCell(r, 3), { value: hm(s.work_minutes), alignment: { horizontal: "right" } });
        Object.assign(ws.getCell(r, 4), { value: "약 " + hm(Math.round(s.work_minutes / weeks)), alignment: { horizontal: "right" } });
        Object.assign(ws.getCell(r, 5), { value: s.work_days + "일", alignment: { horizontal: "right" } });
    });
    box(t2, 2, r, 5);
    const issues = days.filter((d) => d.issue);
    if (issues.length) {
        r += 2;
        issues.forEach((d) => { ws.getCell(r, 2).value = `* ${slashDate(d.work_date)} ${d.name}: ${d.issue}`; ws.getCell(r, 2).font = { size: 9 }; r++; });
    }
    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `조교 급여정산 ${ym.y}년 ${ym.m}월.xlsx`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function StatCard({ label, value, sub, tone }) {
    return h("div", { className: "rounded-2xl p-4", style: { background: "#fff", border: `1px solid ${LINE}` } },
        h("div", { style: { fontSize: 12, color: SUBINK, fontWeight: 700 } }, label),
        h("div", { style: { fontSize: 20, fontWeight: 800, color: tone || INK, marginTop: 4 } }, value),
        sub && h("div", { style: { fontSize: 11.5, color: SUBINK, marginTop: 2 } }, sub)
    );
}

        setError(""); setData(null);
        try { setData(await fetchPayroll(ym)); } catch (e) { console.error(e); setError(e.message || "불러오지 못했어요"); }

}

function RatesView() {
    const [assistants, setAssistants] = useState([]);
    const [rates, setRates] = useState([]);
    const [error, setError] = useState("");
    const [loaded, setLoaded] = useState(false);
    const nextMonth1 = (() => { const t = seoulToday().split("-").map(Number); const n = shiftYM({ y: t[0], m: t[1] }, 1); return `${n.y}-${String(n.m).padStart(2, "0")}-01`; })();
    const [form, setForm] = useState({ assistant_id: "", hourly_rate: "", effective_from: nextMonth1, deduction: "3.3", note: "" });
    const [saving, setSaving] = useState(false);
    const today = seoulToday();
    const load = async () => {
        setError("");
        const [a, r] = await Promise.all([
            supabaseClient.from("attn_assistants").select("id,name,status").order("name"),
            supabaseClient.from("attn_pay_rates").select("*").order("effective_from", { ascending: false }),
        ]);
        if (a.error || r.error) { setError((a.error || r.error).message); return; }
        setAssistants(a.data || []); setRates(r.data || []); setLoaded(true);
    };
    useEffect(() => { load(); }, []);
    const add = async (e) => {
        e.preventDefault();
        const rate = parseInt(String(form.hourly_rate).replace(/[^0-9]/g, ""), 10);
        const ded = Number(form.deduction) / 100;
        if (!form.assistant_id || !rate || !form.effective_from || isNaN(ded)) { alert("조교, 시급, 적용 시작일을 입력해 주세요."); return; }
        const name = (assistants.find((x) => x.id === form.assistant_id) || {}).name;
        if (form.effective_from <= today && !window.confirm(`${name} 시급을 ${slashDate(form.effective_from)}부터 ${rate.toLocaleString("ko-KR")}원으로 바꾸면, 그날 이후 이미 근무한 날의 정산 금액도 바뀝니다. 계속할까요?`)) return;
        setSaving(true);
        const { error } = await supabaseClient.from("attn_pay_rates").upsert({
            assistant_id: form.assistant_id, hourly_rate: rate, deduction_rate: ded, effective_from: form.effective_from, note: form.note || null,
        }, { onConflict: "assistant_id,effective_from" });
        setSaving(false);
        if (error) { alert("저장하지 못했어요: " + error.message); return; }
        setForm({ ...form, hourly_rate: "", note: "" });
        load();
    };
    const remove = async (r, name) => {
        if (!window.confirm(`${name}의 ${slashDate(r.effective_from)} 적용 시급(${r.hourly_rate.toLocaleString("ko-KR")}원)을 삭제할까요?`)) return;
        const { error } = await supabaseClient.from("attn_pay_rates").delete().eq("id", r.id);
        if (error) { alert("삭제하지 못했어요: " + error.message); return; }
        load();
    };
    const inputStyle = { border: `1px solid ${LINE}`, background: "#fff" };
    const visible = assistants.filter((a) => a.status === "재직" || rates.some((r) => r.assistant_id === a.id));

    return h("div", null,
        h("h1", { style: { fontSize: 20, fontWeight: 800 } }, "시급 관리"),
        h("div", { style: { fontSize: 12, color: SUBINK, marginTop: 2, marginBottom: 16 } }, "적용 시작일부터 근무한 날에 새 시급이 적용돼요. 조교 계정에서는 이 정보가 보이지 않습니다."),
        error && h("div", { className: "rounded-xl p-4 mb-4 text-sm", style: { background: RED_SOFT, color: RED } }, error),
        h("form", { onSubmit: add, className: "rounded-2xl p-4 mb-5 grid grid-cols-2 md:grid-cols-6 gap-2 items-end", style: { background: "#fff", border: `1px solid ${LINE}` } },
            h("label", { className: "col-span-2 md:col-span-1 text-xs font-bold", style: { color: SUBINK } }, "조교",
                h("select", { value: form.assistant_id, onChange: (e) => setForm({ ...form, assistant_id: e.target.value }), className: "w-full mt-1 px-2 py-2 rounded-lg text-sm", style: inputStyle },
                    h("option", { value: "" }, "선택"), visible.map((a) => h("option", { key: a.id, value: a.id }, a.name)))),
            h("label", { className: "text-xs font-bold", style: { color: SUBINK } }, "시급(원)",
                h("input", { inputMode: "numeric", value: form.hourly_rate, onChange: (e) => setForm({ ...form, hourly_rate: e.target.value }), placeholder: "13000", className: "w-full mt-1 px-2 py-2 rounded-lg text-sm", style: inputStyle })),
            h("label", { className: "text-xs font-bold", style: { color: SUBINK } }, "적용 시작일",
                h("input", { type: "date", value: form.effective_from, onChange: (e) => setForm({ ...form, effective_from: e.target.value }), className: "w-full mt-1 px-2 py-2 rounded-lg text-sm", style: inputStyle })),
            h("label", { className: "text-xs font-bold", style: { color: SUBINK } }, "공제율(%)",
                h("input", { inputMode: "decimal", value: form.deduction, onChange: (e) => setForm({ ...form, deduction: e.target.value }), className: "w-full mt-1 px-2 py-2 rounded-lg text-sm", style: inputStyle })),
            h("label", { className: "text-xs font-bold", style: { color: SUBINK } }, "메모",
                h("input", { value: form.note, onChange: (e) => setForm({ ...form, note: e.target.value }), placeholder: "예: 시급 인상", className: "w-full mt-1 px-2 py-2 rounded-lg text-sm", style: inputStyle })),
            h("button", { type: "submit", disabled: saving, className: "col-span-2 md:col-span-1 py-2.5 rounded-lg text-sm font-bold", style: { background: NAVY, color: "#fff", opacity: saving ? 0.6 : 1 } }, saving ? "저장 중..." : "시급 등록")
        ),

        h("div", { className: "grid md:grid-cols-2 gap-3" }, visible.map((a) => {
            const mine = rates.filter((r) => r.assistant_id === a.id);
            const current = mine.find((r) => r.effective_from <= today);
            const upcoming = mine.filter((r) => r.effective_from > today).sort((x, y) => (x.effective_from < y.effective_from ? -1 : 1));
            return h("div", { key: a.id, className: "rounded-2xl p-4", style: { background: "#fff", border: `1px solid ${LINE}` } },
                h("div", { className: "flex items-baseline justify-between" },
                    h("div", { style: { fontWeight: 800, fontSize: 15 } }, a.name, a.status !== "재직" && h("span", { style: { fontSize: 11, color: SUBINK, marginLeft: 6 } }, a.status)),
                    h("div", { style: { fontWeight: 800, fontSize: 18, color: current ? NAVY : RED } }, current ? current.hourly_rate.toLocaleString("ko-KR") + "원" : "시급 미등록")),

}

// [2026-08-06] 조교쌤은 실제로 업무보드·출결관리 두 화면만 쓰고 수업관리·학생관리는 접근 권한이 없어서,

const NAV_GROUP_OPEN_KEY = "nav_group_ops_open";
function navItemActive(t, activeKey) { return t.key === activeKey || (t.children || []).some((c) => c.key === activeKey); }
function SidebarNavGroup({ item, activeKey }) {

    const [open, setOpen] = React.useState(() => {
        if (containsActive) return true;
        try { const v = localStorage.getItem(NAV_GROUP_OPEN_KEY); return v === null ? true : v === "1"; } catch (e) { return true; }
    });
    const toggle = () => setOpen((v) => {
        const nv = !v;
        try { localStorage.setItem(NAV_GROUP_OPEN_KEY, nv ? "1" : "0"); } catch (e) {}
        return nv;
    });
    return React.createElement("div", null,
        React.createElement("button", {
            type: "button", onClick: toggle, "aria-expanded": open,
            className: "w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-sm font-semibold transition-colors",
            style: { background: "transparent", color: containsActive ? NAVY : SUBINK, textAlign: "left" },
        },
            React.createElement("span", { style: { fontSize: 15 } }, item.icon),
            React.createElement("span", { style: { flex: 1 } }, item.label),
            React.createElement("span", { style: { fontSize: 10, display: "inline-block", transform: open ? "rotate(180deg)" : "none", transition: "transform .15s" } }, "▾")
        ),
        open && React.createElement("div", { className: "flex flex-col gap-0.5 mt-0.5", style: { marginLeft: 16, paddingLeft: 8, borderLeft: `1px solid ${LINE}` } },
            item.children.map((c) => React.createElement("a", {
                key: c.key, href: c.href,
                className: "flex items-center gap-2 px-3 py-2 rounded-lg text-[13px] font-semibold transition-colors",
                style: { background: c.key === activeKey ? NAVY_SOFT : "transparent", color: c.key === activeKey ? NAVY : SUBINK, textDecoration: "none" },
            }, React.createElement("span", { style: { fontSize: 13 } }, c.icon), c.label))
        )
    );
}
function renderSidebarNav(items, activeKey) {
    return items.map((t) => t.children
        ? React.createElement(SidebarNavGroup, { key: t.key, item: t, activeKey })
        : React.createElement("a", {
            key: t.key, href: t.href,
            className: "flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-sm font-semibold transition-colors",
            style: { background: t.key === activeKey ? NAVY_SOFT : "transparent", color: t.key === activeKey ? NAVY : SUBINK, textDecoration: "none" },
        }, React.createElement("span", { style: { fontSize: 15 } }, t.icon), t.label));
}
function renderMobileNav(items, activeKey) {
    return items.map((t) => {
        const on = navItemActive(t, activeKey);
        return React.createElement("a", {
            key: t.key, href: t.href,
            className: "flex-1 flex flex-col items-center gap-0.5 py-2.5 text-[11px] font-semibold",
            style: { color: on ? NAVY : SUBINK, textDecoration: "none" },
        }, React.createElement("span", { style: { fontSize: 17 } }, t.icon), t.mobileLabel || t.label);
    });
}
// 학원운영관리 안의 화면(학생관리/급여 정산/시급 관리) 위쪽에 놓는 알약 탭 - 모바일에서는 하단 내비게이션에

function OpsPillTabs({ activeKey, onSelect }) {
    const group = NAV_ITEMS.find((t) => t.key === "ops");
    return React.createElement("div", { className: "flex gap-2 mb-5 overflow-x-auto" },
        group.children.map((c) => {
            const on = c.key === activeKey;
            const sameHash = onSelect && c.href.startsWith("operations.html#");
            return React.createElement("a", {
                key: c.key, href: c.href,
                onClick: sameHash ? (e) => { e.preventDefault(); onSelect(c.key); } : undefined,

                style: { background: on ? NAVY : "#fff", color: on ? "#fff" : SUBINK, border: `1px solid ${on ? NAVY : LINE}`, textDecoration: "none" },

// ============================================================
// 로그인 12시간 후 자동 로그아웃 (index.html / attendance.html / allgoodstudy.html과 동일 정책,
// 같은 도메인이라 로그인 세션이 공유되므로 여기서도 같은 규칙을 맞춰둠)
// ============================================================
const LOGIN_AT_KEY = "attn_login_at";
const AUTO_LOGOUT_MS = 12 * 60 * 60 * 1000;

function Root() {
  const [session, setSession] = useState(null);
  const [checked, setChecked] = useState(false);

  useEffect(() => {
    const checkAutoLogout = () => {
      const loginAt = Number(localStorage.getItem(LOGIN_AT_KEY) || 0);
      if (loginAt && Date.now() - loginAt > AUTO_LOGOUT_MS) {
        supabaseClient.auth.signOut();
      }
    };
    supabaseClient.auth.getSession().then(({ data }) => {
      if (data.session && !localStorage.getItem(LOGIN_AT_KEY)) {
        localStorage.setItem(LOGIN_AT_KEY, String(Date.now()));
      }
      checkAutoLogout();
      setSession(data.session);
      setChecked(true);
    });
    const { data: sub } = supabaseClient.auth.onAuthStateChange((event, s) => {
      if (event === "SIGNED_IN") {
        localStorage.setItem(LOGIN_AT_KEY, String(Date.now()));
      } else if (event === "SIGNED_OUT") {
        localStorage.removeItem(LOGIN_AT_KEY);
      }
      setSession(s);
    });
    const timer = setInterval(checkAutoLogout, 5 * 60 * 1000);
    return () => { sub.subscription.unsubscribe(); clearInterval(timer); };
  }, []);

  if (!checked) {
    return h("div", { style: { minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: SUBINK, fontSize: 13 } }, "불러오는 중...");
  }
  if (!session) {
    return h(LoginScreen, null);
  }
  const isDirector = session.user.app_metadata && session.user.app_metadata.role === "director";
  if (!isDirector) {
    return h(DirectorOnlyMessage, null);
  }
  return h(OperationsPage, { session });
}

ReactDOM.createRoot(document.getElementById("root")).render(h(Root, null));
</script>
