// class 필드 원문(예: "중학과정 중3-2 시작", "고등과정 미적분1")에서 앞쪽 "OO과정" 표기를
// 떼어내고, 남은 텍스트의 첫 단어를 반명으로 간주해서 추출한다. 같은 반이어도 뒤에 붙는
// 메모(시작/복습, 과목명 등)가 서로 달라 문자열 전체가 다를 수 있어, 첫 단어만 기준으로 삼는다.
function extractClassName(classStr) {
    const raw = (classStr || "").trim();
    if (!raw)
        return "";
    const withoutLevel = raw.replace(/^(초등|중등|중학|고등)(?:학교)?과정\s*/, "");
    return withoutLevel.split(/[\s,]+/)[0] || "";
}
function groupByClass(list) {
    const groups = {};
    list.forEach((s) => {
        const key = extractClassName(s.class) || "반 미지정";
        (groups[key] = groups[key] || []).push(s);
    });
    const keys = Object.keys(groups).sort((a, b) => {
        if (a === "반 미지정")
            return 1;
        if (b === "반 미지정")
            return -1;
        return a.localeCompare(b, "ko");
    });
    return keys.map((k) => ({ className: k, list: groups[k] }));
}
// 특강(추가강좌) 출석체크 명단을 강좌명 기준으로 묶는다. 같은 강좌를 여러 학생이 들으면 한 그룹으로 모임.
function groupByCourseName(list) {
    const groups = {};
    list.forEach((c) => {
        const key = c.courseName || "강좌명 미지정";
        (groups[key] = groups[key] || []).push(c);
    });
    return Object.keys(groups).sort((a, b) => a.localeCompare(b, "ko")).map((k) => ({ className: k, list: groups[k] }));
}

function groupByTime(list, timeField) {
    const groups = {};
    list.forEach((s) => {
        const key = s[timeField] && s[timeField].trim() ? s[timeField].trim() : "\uC2DC\uAC04 \uBBF8\uC9C0\uC815";
        (groups[key] = groups[key] || []).push(s);
    });
    const keys = Object.keys(groups).sort((a, b) => {
        if (a === "\uC2DC\uAC04 \uBBF8\uC9C0\uC815")
            return 1;
        if (b === "\uC2DC\uAC04 \uBBF8\uC9C0\uC815")
            return -1;
        return a.localeCompare(b);
    });
    return keys.map((k) => ({ className: k, list: groups[k] }));
}
// [분리 작업] schoolLevelOf가 의존하는 헬퍼라서 원래 StudentManager 구역(attendance.html 4041줄)에서
// 그대로 옮겨왔다 - StudentManager 자체는 옮기지 않았지만 이 함수만 빠져있으면 schoolLevelOf가 깨진다.
function parseClassString(classStr) {
    const str = (classStr || "").trim();
    if (str.startsWith("중등과정")) return { courseLevel: "중등과정", courseName: str.slice(4).trim() };
    if (str.startsWith("고등과정")) return { courseLevel: "고등과정", courseName: str.slice(4).trim() };
    return { courseLevel: "", courseName: str };
}
function schoolLevelOf(s) {
    // 실제 다니는 학교명이 학년 단계의 진짜 기준이라 항상 먼저 확인한다. "수강과정"(중등과정/고등과정)은
    // 선행학습 반 이름일 뿐이라 실제 학교와 다를 수 있다 (예: 초등학교 6학년이 "중등과정 예비중" 반을
    // 듣는 경우 - courseLevel을 먼저 보면 "중6학년"이라는 있을 수 없는 조합이 나와버린다).
    const school = s.school || "";
    if (school.includes("초등") || /초$/.test(school))
        return "초";
    if (school.includes("중학") || /중$/.test(school))
        return "중";
    if (school.includes("고등") || /고$/.test(school))
        return "고";
    // 학교명이 비어있거나 위 패턴과 안 맞을 때만 수강과정으로 대체 추정한다.
    const level = parseClassString(s.class).courseLevel;
    if (level === "중등과정")
        return "중";
    if (level === "고등과정")
        return "고";
    return "";
}
function groupByGrade(list) {
    const buckets = {};
    list.forEach((s) => {
        const gradeNum = s.grade && String(s.grade).trim();
        const lvl = schoolLevelOf(s);
        const key = gradeNum ? `${lvl}${gradeNum}\uD559\uB144` : "\uD559\uB144 \uBBF8\uC9C0\uC815";
        if (!buckets[key])
            buckets[key] = { level: lvl, grade: gradeNum ? parseInt(gradeNum, 10) || 0 : 0, list: [] };
        buckets[key].list.push(s);
    });
    const levelOrder = { "\uCD08": 0, "\uC911": 1, "\uACE0": 2, "": 3 };
    const keys = Object.keys(buckets).sort((a, b) => {
        if (a === "\uD559\uB144 \uBBF8\uC9C0\uC815")
            return 1;
        if (b === "\uD559\uB144 \uBBF8\uC9C0\uC815")
            return -1;
        const A = buckets[a], B = buckets[b];
        const lo = (levelOrder[A.level] ?? 3) - (levelOrder[B.level] ?? 3);
        if (lo !== 0)
            return lo;
        return A.grade - B.grade;
    });
    return keys.map((k) => ({ className: k, list: buckets[k].list }));
}
function groupBySchool(list) {
    const groups = {};
    list.forEach((s) => {
        const key = s.school && s.school.trim() ? s.school.trim() : "\uD559\uAD50 \uBBF8\uC9C0\uC815";
        (groups[key] = groups[key] || []).push(s);
    });
    const keys = Object.keys(groups).sort((a, b) => {
        if (a === "\uD559\uAD50 \uBBF8\uC9C0\uC815")
            return 1;
        if (b === "\uD559\uAD50 \uBBF8\uC9C0\uC815")
            return -1;
        return a.localeCompare(b, "ko");
    });
    return keys.map((k) => ({ className: k, list: groups[k] }));
}

// 주어진 달(Date)의 1일부터 말일까지 { day, dateStr, weekday } 목록을 만든다.
function daysInMonthList(monthDate) {
    const year = monthDate.getFullYear(), month = monthDate.getMonth();
    const n = new Date(year, month + 1, 0).getDate();
    const arr = [];
    for (let day = 1; day <= n; day++) {
        const dt = new Date(year, month, day);
        arr.push({ day, dateStr: fmt(dt), weekday: JS_DAY_TO_KOR[dt.getDay()] });
    }
    return arr;
}
function monthInputValue(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; }
function fmt(d) {
    const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
}
function todayStr() { return fmt(new Date()); }
function addDays(dateStr, delta) {
    const d = new Date(dateStr + "T00:00:00");
    d.setDate(d.getDate() + delta);
    return fmt(d);
}
// 이력 리스트 중, 주어진 날짜에 유효했던 구간을 찾는다. 없으면 null.
// (호출 쪽에서 정렬해서 넘겨준다는 가정에 기대지 않고, 여기서 한 번 더 오름차순 정렬해서 안전하게 처리한다.)
function resolveHistoryAsOf(historyList, dateStr) {
    if (!historyList || historyList.length === 0)
        return null;
    const sorted = historyList.slice().sort((a, b) => (a.effectiveFrom < b.effectiveFrom ? -1 : a.effectiveFrom > b.effectiveFrom ? 1 : 0));
    let found = null;
    for (const h of sorted) {
        if (h.effectiveFrom <= dateStr)
            found = h;
        else
            break;
    }
    return found;
}
// 학생 객체(s)에 특정 날짜 기준 이력 값을 덮어씌운다. 해당 날짜의 이력이 없으면(예: 이력 도입 전
// 데이터이거나 기록이 아직 없는 학생) 학생의 현재 값을 그대로 사용한다.
function applyHistoryAsOf(s, historyList, dateStr) {
    const h = resolveHistoryAsOf(historyList, dateStr);
    if (!h)
        return s;
    return { ...s, school: h.school, grade: h.grade, class: h.class, regularTime: h.regularTime, saturdayTime: h.saturdayTime, clinic: h.clinic, clinicTime: h.clinicTime, clinicDays: h.clinicDays, days: h.days };
}
// 토요일 정규수업은 평일과 시작시간이 달라서, 학생이 등원요일에 토요일을 선택했고 토요일 출석시간이
// 별도로 저장돼 있으면 그 날짜가 토요일일 때는 그 시간을, 아니면 평소 출석시간을 사용한다.
function effectiveRegularTimeFor(s, weekday) {
    return weekday === "토" && s.saturdayTime ? s.saturdayTime : s.regularTime;
}

function korWeekdayOf(dateStr) {
    return JS_DAY_TO_KOR[new Date(dateStr + "T00:00:00").getDay()];
}

// ---------- 출결 자동 시간기록(checked_at) 관련 헬퍼 (2026-08-07 추가) ----------
// "18:00~20:30" 같은 시간범위 문자열에서 시작 시각("18:00")만 뽑아낸다. 보강(scheduledTime)처럼
// 범위 없이 "19:00"만 있는 경우도 그대로 통과시킨다.
function parseStartTime(rangeStr) {
    if (!rangeStr) return "";
    const first = String(rangeStr).split("~")[0].trim();
    return /^\d{1,2}:\d{2}$/.test(first) ? first : "";
}
// timestamptz(checked_at) -> 브라우저 로컬시각(=학원 기준 한국시간) "HH:MM" 문자열
function checkedAtHHMM(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}
// "HH:MM" 두 시각의 분 차이 (a - b). 정시보다 늦으면 양수, 이르면 음수.
function minutesDiffHHMM(aHHMM, bHHMM) {
    const [ah, am] = aHHMM.split(":").map(Number);
    const [bh, bm] = bHHMM.split(":").map(Number);
    return (ah * 60 + am) - (bh * 60 + bm);
}
// "HH:MM" 입력값 + 기준 날짜(attn_date)를 합쳐서 checked_at에 저장할 ISO 문자열로 변환(시각 직접 수정용).
function hhmmToIsoOnDate(dateStr, hhmm) {
    return new Date(`${dateStr}T${hhmm}:00`).toISOString();
}

// 수업계획(정규/클리닉/보강/특강)에서 조교가 실제로 코멘트를 "입력"했을 때만 호출됨(완료/미완료 토글만으로는
// 호출되지 않음). 오늘 그 조교가 이미 그 학생에 대해 써둔 근무일지가 있으면 지도내용(content)은 그대로
// 두고 전달사항(noteToDirector)만 이 코멘트로 갱신한다. 근무일지가 아직 없으면 여기서 자동으로 만들지
// 않는다(필수 항목인 지도내용을 시스템이 임의로 채워 넣지 않기 위함) — 대신 조교가 나중에 그 학생의 근무일지를
// 새로 열 때 fetchAssistantCommentsForStudentDate로 모아서 전달사항 칸에 프리필해준다.
async function syncPlanCommentToWorkLog(date, studentId, comment, authorEmail) {
    const trimmed = (comment || "").trim();
    if (!trimmed) return;
    const entries = await fetchWorkLogsForDateAuthor(date, authorEmail);
    const existing = entries.find((r) => r.studentIds.includes(studentId));
    if (!existing) return; // 근무일지가 아직 없으면 자동 생성하지 않음 — 조교가 직접 열 때 프리필됨
    await updateWorkLogRow(existing.id, {
        date, studentIds: existing.studentIds, studentNames: existing.studentNames, studentNote: existing.studentNote,
        content: existing.content, noteToDirector: trimmed,
    });
}

// 출석/지각/조퇴 버튼을 누른 "순간"의 시각을 checked_at에 자동 기록한다. 결석·일정변경은 시간 기록 대상이
// 아니므로 항상 null(2026-08-07 원장님 확인 - 결석은 애초에 등원을 안 한 것이라 시각이 의미 없음).

// 날짜(내일 것을 미리 눌러보거나, 지난 날짜를 나중에 채울 때)의 출석부를 열어서 누르면 실제 클릭 시각과
// 그 날짜의 정시가 전혀 무관해져서 "699분 지각" 같은 엉뚱한 계산이 나옴(2026-08-08 발견/수정) - 그래서
// 오늘 날짜가 아니면 자동으로는 시각을 채우지 않고, 필요하면 연필 아이콘으로 직접 입력하게 한다.
async function setAttendanceRow(date, session, studentId, status, isCurrentlyActive) {
    if (isCurrentlyActive) {
        const { error } = await supabaseClient.from("attn_attendance").delete()
            .eq("attn_date", date).eq("session", session).eq("student_id", studentId);
        if (error)
            throw error;
    }
    else {
        const isTimeStatus = (status === "출석" || status === "지각" || status === "조퇴");
        const checkedAt = (isTimeStatus && date === todayStr()) ? new Date().toISOString() : null;
        const { error } = await supabaseClient.from("attn_attendance").upsert({ attn_date: date, session, student_id: studentId, status, checked_at: checkedAt, updated_at: new Date().toISOString() }, { onConflict: "attn_date,session,student_id" });
        if (error)
            throw error;
    }
}

}

function emptyNoteMeta() { return { note: "", done: false, doneBy: "", doneAt: "", comment: "" }; }
async function fetchSessionNotesForDate(date) {

async function setCourseAttendanceRow(date, courseId, studentId, status, isCurrentlyActive) {

// 일정변경: 원래 출석부에 목적지(날짜/시간)를 기록하고, 그 날짜의 보강 명단에 자동 등록
async function setScheduleChange(date, session, studentId, targetDate, targetTime, note, addedBy, prevTargetDate, origin) {
    const { error } = await supabaseClient.from("attn_attendance").update({
        target_date: targetDate || null, target_time: targetTime || null, reason: note || "", updated_at: new Date().toISOString(),
    }).eq("attn_date", date).eq("session", session).eq("student_id", studentId);
    if (error)
        throw error;
    if (prevTargetDate && prevTargetDate !== targetDate) {
        try {
            await removeExtraRosterRow(prevTargetDate, studentId);
        }
        catch (e) {
            console.error(e);
        }
    }
    if (targetDate) {
        await addExtraRosterRow(targetDate, studentId, addedBy, targetTime || "", origin);
    }
}
// 특강(추가강좌) 일정변경: 정규수업의 setScheduleChange와 동일한 구조. 세션이 아니라 course_id로 대상 행을 찾는다.
async function setCourseScheduleChange(date, courseId, studentId, targetDate, targetTime, note, addedBy, prevTargetDate, origin) {
    const { error } = await supabaseClient.from("attn_course_attendance").update({
        target_date: targetDate || null, target_time: targetTime || null, reason: note || "", updated_at: new Date().toISOString(),
    }).eq("attn_date", date).eq("course_id", courseId);
    if (error)
        throw error;
    if (prevTargetDate && prevTargetDate !== targetDate) {
        try {
            await removeExtraRosterRow(prevTargetDate, studentId);
        }
        catch (e) {
            console.error(e);
        }
    }
    if (targetDate) {
        await addExtraRosterRow(targetDate, studentId, addedBy, targetTime || "", origin);
    }
}

// ---------- 월별출석부(원장 전용) - 한 달 범위를 한 번에 불러오는 함수들 ----------
// 기존 화면(출석체크)의 하루 단위 fetch 함수들과는 완전히 별개로 새로 추가한 것이라 기존 로직에는 영향 없음.
// checkedAtByDate는 같은 모양(attn_date -> session -> student_id)으로, 값이 있는 건(출석/지각/조퇴)만 채워진다.
// byDate(상태 문자열 그리드)는 기존 그대로 두고 시각만 별도 맵으로 얹은 것 - 기존 사용처(격자표)는 영향 없음.
async function fetchAttendanceRange(startDate, endDate) {
    const { data, error } = await supabaseClient.from("attn_attendance").select("attn_date, session, student_id, status, checked_at").gte("attn_date", startDate).lte("attn_date", endDate);
    if (error)
        throw error;
    const byDate = {};
    const checkedAtByDate = {};
    data.forEach((r) => {
        byDate[r.attn_date] = byDate[r.attn_date] || { regular: {}, clinic: {}, extra: {} };
        byDate[r.attn_date][r.session][r.student_id] = r.status;
        if (r.checked_at) {
            checkedAtByDate[r.attn_date] = checkedAtByDate[r.attn_date] || { regular: {}, clinic: {}, extra: {} };
            checkedAtByDate[r.attn_date][r.session][r.student_id] = r.checked_at;
        }
    });
    return { byDate, checkedAtByDate };
}
// 보강은 그날그날 명단에 있어야만 "그 학생이 그날 보강 대상이었다"는 뜻이라, 정규수업/클리닉처럼
// 요일로 계산할 수 없다 - attn_extra_roster에 실제로 있었던 날짜만 별도로 불러온다.
async function fetchExtraRosterRange(startDate, endDate) {
    const { data, error } = await supabaseClient.from("attn_extra_roster").select("attn_date, student_id").gte("attn_date", startDate).lte("attn_date", endDate);
    if (error)
        throw error;
    const byDate = {};
    data.forEach((r) => {
        byDate[r.attn_date] = byDate[r.attn_date] || {};
        byDate[r.attn_date][r.student_id] = true;
    });
    return byDate;
}
// attn_course_attendance는 (attn_date, course_id)가 이미 학생 한 명을 특정하므로 course_id만으로 충분.

// 실제 현재 날짜/요일/시각을 초 단위로 보여주는 상시 표시 바 (2026-08-08 추가). 출석체크 화면 상단,
// 날짜 선택 바로 아래에 둬서 "자동 시간기록은 지금 이 순간 기준"이라는 걸 직관적으로 알 수 있게 하고,
// 오늘이 아닌 다른 날짜를 보고 있을 때는 위 날짜 선택과 이 실제 시각이 서로 다르다는 게 한눈에 보여서
// 자동기록이 왜 안 채워지는지도 자연스럽게 짐작 가능하게 함.
function LiveClockBar() {
    const [now, setNow] = useState(() => new Date());
    useEffect(() => {
        const id = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(id);
    }, []);
    const dateLabel = `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일(${JS_DAY_TO_KOR[now.getDay()]})`;
    const timeLabel = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}:${String(now.getSeconds()).padStart(2, "0")}`;
    return React.createElement(
        "div",
        { className: "flex items-center gap-2 flex-wrap rounded-xl mt-2", style: { background: NAVY_SOFT, color: NAVY, padding: "9px 14px" } },
        React.createElement("span", { style: { fontSize: 11.5, opacity: 0.75, flexShrink: 0 } }, "현재 시각"),
        React.createElement("span", { style: { fontSize: 14, fontWeight: 700, fontVariantNumeric: "tabular-nums", letterSpacing: 0.2 } }, dateLabel, " · ", timeLabel)
    );
}

// ============================================================
// Main app
// [분리 작업] 원래 MainApp은 대시보드/출석체크/스태프룸/학생관리/월별출석부 5개 탭을 사이드바로 전환하는
// 구조였다. 이 파일에는 출석체크·월별출석부만 남기고(나머지는 workboard.html/students.html로 이동),
// students·studentCourses·assistants(myAssistant 계산용)를 불러오고 실시간 구독을 유지하는 부분은
// 원래 MainApp 로직을 그대로 옮겼다 - Attendance/MonthlyAttendanceReport가 그대로 필요로 하기 때문.
// goRegisterStudentFromDiagnostic(학생관리로 이동)/goToWorkLog(스태프룸 근무일지로 이동)/goToClockIn(스태프룸
// 출퇴근으로 이동)은 원래 같은 페이지 안에서 setTab()으로 건너뛰던 다리 역할이었는데, 이제 다른(분리된)
// 페이지로 실제 이동해야 해서 sessionStorage 키 "attn_cross_page_handoff"에 이동할 곳/필요한 값을 담아두고
// 그 페이지로 location 이동하는 방식으로 바꿨다(2026-08 후속 수정). workboard.html은 이미 이 키를 읽어서
// workLog/clockIn 페이로드를 소비하도록 만들어져 있었고, students.html에도 studentPrefill 페이로드를
// 소비하는 로직을 같은 방식으로 추가했다.
// ============================================================
function MainApp({ session }) {
    const role = session.user.app_metadata && session.user.app_metadata.role === "director" ? "director" : "assistant";
    const isDirector = role === "director";
    const [pageTab, setPageTab] = useState("attendance");
    useEffect(() => { if (pageTab === "monthlyReport" && !isDirector) setPageTab("attendance"); }, [pageTab, isDirector]);
    const [students, setStudents] = useState([]);
    const [studentsLoaded, setStudentsLoaded] = useState(false);
    const [assistants, setAssistants] = useState([]);
    // 추가강좌(한 학생이 2강좌 이상 수강할 때, 메인 정규수업과는 별개로 붙이는 강좌 목록) - Attendance(특강 탭)와
    // MonthlyAttendanceReport(특강 서브탭) 양쪽에 그대로 전달한다.
    const [studentCourses, setStudentCourses] = useState([]);
    const [selectedDate, setSelectedDate] = useState(todayStr());
    const [attSession, setAttSession] = useState("regular");
    const [attGroupMode, setAttGroupMode] = useState("time");
    // 로그인 세션 동안(=이 화면을 새로고침하기 전까지) 출근 안내 팝업은 딱 한 번만 뜨도록 하는 플래그.
    const [clockInAlertShown, setClockInAlertShown] = useState(false);
    const reloadStudents = async () => {
        try {
            setStudents(await fetchStudentsRoster());
        } catch (e) {
            console.error(e);
        }
    };
    const reloadAssistants = async () => {
        try {
            setAssistants(await fetchAssistants());
        } catch (e) {
            console.error(e);
        }
    };
    const reloadStudentCourses = async () => {
        try {
            setStudentCourses(await fetchAllStudentCourses());
        } catch (e) {
            console.error(e);
        }
    };
    useEffect(() => { reloadStudents().then(() => setStudentsLoaded(true)); }, []);
    useEffect(() => { reloadAssistants(); }, []);
    useEffect(() => { reloadStudentCourses(); }, []);
    // realtime: 다른 사람이 추가강좌를 등록/수정/삭제하면 자동 반영
    useEffect(() => {
        const channel = supabaseClient
            .channel("attn_student_courses_changes")
            .on("postgres_changes", { event: "*", schema: "public", table: "attn_student_courses" }, () => {
                reloadStudentCourses();
            })
            .subscribe();
        return () => { supabaseClient.removeChannel(channel); };
    }, []);
    // realtime: 다른 사람이 학생 정보를 추가/수정/삭제하면 자동 반영
    useEffect(() => {
        const channel = supabaseClient
            .channel("attn_students_changes")
            .on("postgres_changes", { event: "*", schema: "public", table: "attn_students" }, () => {
                reloadStudents();
            })
            .subscribe();
        return () => { supabaseClient.removeChannel(channel); };
    }, []);
    // realtime: 조교명단이 바뀌면 자동 반영 (내 로그인 계정 매칭에도 영향)
    useEffect(() => {
        const channel = supabaseClient
            .channel("attn_assistants_changes")
            .on("postgres_changes", { event: "*", schema: "public", table: "attn_assistants" }, () => {
                reloadAssistants();
            })
            .subscribe();
        return () => { supabaseClient.removeChannel(channel); };
    }, []);
    const myAssistant = useMemo(() => assistants.find((a) => a.email === session.user.email) || null, [assistants, session.user.email]);
    // 다른 페이지(workboard.html/students.html)로 넘어가면서 그 화면이 특정 항목에 바로 포커스하도록
    // sessionStorage에 페이로드를 남겨두는 다리 함수들 - 페이지 이동은 location.href로 실제 이동한다.
    const goToWorkLog = (studentId, date, mode) => {
        sessionStorage.setItem("attn_cross_page_handoff", JSON.stringify({ to: "workLog", studentId, date, mode: mode || "write", token: Date.now() }));
        window.location.href = "workboard.html";
    };
    const goToClockIn = () => {
        sessionStorage.setItem("attn_cross_page_handoff", JSON.stringify({ to: "clockIn", token: Date.now() }));
        window.location.href = "workboard.html";
    };
    const goRegisterStudentFromDiagnostic = (prefillData) => {
        sessionStorage.setItem("attn_cross_page_handoff", JSON.stringify({ to: "studentPrefill", ...prefillData, token: Date.now() }));
        window.location.href = "students.html";
    };
    const content = !studentsLoaded
        ? React.createElement("div", { style: { color: SUBINK, fontSize: 13, padding: "40px 0", textAlign: "center" } }, "불러오는 중...")
        : React.createElement(
            React.Fragment,
            null,
            React.createElement(AttendancePillTabs, { pageTab: pageTab, setPageTab: setPageTab, isDirector: isDirector }),
            pageTab === "attendance" && React.createElement(Attendance, {
                students: students, selectedDate: selectedDate, setSelectedDate: setSelectedDate, authorEmail: session.user.email,
                attSession: attSession, setAttSession: setAttSession, attGroupMode: attGroupMode, setAttGroupMode: setAttGroupMode,
                isDirector: isDirector, goRegisterStudentFromDiagnostic: goRegisterStudentFromDiagnostic, studentCourses: studentCourses, goToWorkLog: goToWorkLog,
                myAssistant: myAssistant, goToClockIn: goToClockIn, clockInAlertShown: clockInAlertShown, markClockInAlertShown: () => setClockInAlertShown(true),
            }),
            pageTab === "monthlyReport" && isDirector && React.createElement(MonthlyAttendanceReport, { students: students, studentCourses: studentCourses })
        );
    return React.createElement(PageShell, { session: session, isDirector: isDirector }, content);
}

const LOGIN_AT_KEY = "attn_login_at";
const AUTO_LOGOUT_MS = 12 * 60 * 60 * 1000;
function Root() {
    const [session, setSession] = useState(null);
    const [checked, setChecked] = useState(false);
    useEffect(() => {
        const checkAutoLogout = () => {
            const loginAt = Number(localStorage.getItem(LOGIN_AT_KEY) || 0);
            if (loginAt && Date.now() - loginAt > AUTO_LOGOUT_MS) {
                supabaseClient.auth.signOut();
            }
        };
        supabaseClient.auth.getSession().then(({ data }) => {
            // 이미 로그인되어 있는데 시작 시각 기록이 없는 경우(이 기능 배포 전부터 로그인돼있던 경우) - 지금을 기준으로 새로 시작
            if (data.session && !localStorage.getItem(LOGIN_AT_KEY)) {
                localStorage.setItem(LOGIN_AT_KEY, String(Date.now()));
            }
            checkAutoLogout();
            setSession(data.session);
            setChecked(true);
        });
        const { data: sub } = supabaseClient.auth.onAuthStateChange((event, s) => {
            if (event === "SIGNED_IN") {
                localStorage.setItem(LOGIN_AT_KEY, String(Date.now()));
            } else if (event === "SIGNED_OUT") {
                localStorage.removeItem(LOGIN_AT_KEY);
            }
            setSession(s);
        });
        // 탭을 오래 켜둔 채로 있는 경우를 대비해 5분마다 시간 제한 초과 여부를 다시 확인
        const timer = setInterval(checkAutoLogout, 5 * 60 * 1000);
        return () => { sub.subscription.unsubscribe(); clearInterval(timer); };
    }, []);
    if (!checked) {
        return React.createElement("div", { style: { minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: SUBINK, fontSize: 13 } }, "\uBD88\uB7EC\uC624\uB294 \uC911...");
    }
    return session ? React.createElement(MainApp, { session: session }) : React.createElement(LoginScreen, null);
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(Root, null));
