const WEEKDAYS_MON_FIRST = ["월", "화", "수", "목", "금", "토", "일"];
const JS_DAY_TO_KOR = ["일", "월", "화", "수", "목", "금", "토"];
function fmt(d) {
    const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
}
function todayStr() { return fmt(new Date()); }
function addDays(dateStr, delta) {
    const d = new Date(dateStr + "T00:00:00");
    d.setDate(d.getDate() + delta);
    return fmt(d);
}
function korWeekdayOf(dateStr) {
    return JS_DAY_TO_KOR[new Date(dateStr + "T00:00:00").getDay()];
}

function LoginScreen() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [showPassword, setShowPassword] = useState(false);
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  const submit = async (e) => {
    e.preventDefault();
    setError("");
    setLoading(true);
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    setLoading(false);
    if (error) setError("이메일 또는 비밀번호가 올바르지 않습니다.");
  };
  return h("div", { style: { background: PAPER, minHeight: "100vh" }, className: "flex items-center justify-center px-4" },
    h("div", { className: "w-full max-w-sm rounded-2xl p-6", style: { background: "#fff", border: `1px solid ${LINE}` } },
      h("img", { src: LOGO_HORIZONTAL, alt: "올곧수학 더센텀", style: { height: 34, margin: "0 auto 20px", display: "block" } }),
      h("div", { style: { fontWeight: 800, fontSize: 15, textAlign: "center", marginBottom: 18, color: INK } }, "홈 로그인"),
      h("form", { onSubmit: submit, className: "flex flex-col gap-3" },
        h("input", { type: "email", required: true, value: email, onChange: (e) => setEmail(e.target.value), placeholder: "이메일", className: "px-3 py-3 rounded-lg text-sm outline-none", style: { border: `1px solid ${LINE}` } }),
        h("div", { style: { position: "relative" } },
          h("input", { type: showPassword ? "text" : "password", required: true, value: password, onChange: (e) => setPassword(e.target.value), placeholder: "비밀번호", className: "w-full px-3 py-3 rounded-lg text-sm outline-none", style: { border: `1px solid ${LINE}`, paddingRight: 42 } }),
          h("button", { type: "button", onClick: () => setShowPassword((v) => !v), "aria-label": showPassword ? "비밀번호 숨기기" : "비밀번호 보이기", style: { position: "absolute", right: 2, top: "50%", transform: "translateY(-50%)", width: 36, height: 36, display: "flex", alignItems: "center", justifyContent: "center", color: SUBINK, background: "transparent" } }, h(EyeIcon, { off: showPassword }))
        ),
        error && h("div", { style: { color: RED, fontSize: 12.5, fontWeight: 600 } }, error),
        h("button", { type: "submit", disabled: loading, className: "py-3 rounded-lg text-sm font-bold mt-1", style: { background: NAVY, color: "#fff", opacity: loading ? 0.6 : 1 } }, loading ? "로그인 중..." : "로그인")
      ),
      h("div", { style: { fontSize: 11.5, color: SUBINK, marginTop: 14, textAlign: "center" } }, "계정이 없다면 원장님께 문의하세요.")
    )
  );
}

// ============================================================
// 학생관리(StudentManager) 및 의존 함수 - /tmp/attendance.html에서 그대로 옮겨온 부분.
// 아래 supabase 데이터 헬퍼/그룹핑 헬퍼/StudentManager 본체는 attendance.html의 로직을
// 그대로 재사용하며, 새로 리팩터링하지 않는다(실데이터를 다루는 화면이라 정확성이 최우선).
// ============================================================

// ---------- 시간 문자열(HH:MM~HH:MM) 변환 헬퍼 ----------
function parseTimeRange(str) {
    const s = (str || "").trim();
    if (!s)
        return { start: "", end: "" };
    const parts = s.split("~");
    return { start: (parts[0] || "").trim(), end: (parts[1] || "").trim() };
}
function composeTimeRange(start, end) {
    if (start && end)
        return `${start}~${end}`;
    if (start)
        return start;
    return "";
}
function addMinutesToTime(timeStr, minutes) {
    if (!timeStr)
        return "";
    const [hh0, mm0] = timeStr.split(":").map(Number);
    if (Number.isNaN(hh0) || Number.isNaN(mm0))
        return "";
    const total = ((hh0 * 60 + mm0 + minutes) % (24 * 60) + 24 * 60) % (24 * 60);
    const hh = String(Math.floor(total / 60)).padStart(2, "0");
    const mm = String(total % 60).padStart(2, "0");
    return `${hh}:${mm}`;
}

// ---------- 그룹핑 헬퍼 ----------
// class 필드 원문(예: "중학과정 중3-2 시작", "고등과정 미적분1")에서 앞쪽 "OO과정" 표기를
// 떼어내고, 남은 텍스트의 첫 단어를 반명으로 간주해서 추출한다. 같은 반이어도 뒤에 붙는
// 메모(시작/복습, 과목명 등)가 서로 달라 문자열 전체가 다를 수 있어, 첫 단어만 기준으로 삼는다.
function extractClassName(classStr) {
    const raw = (classStr || "").trim();
    if (!raw)
        return "";
    const withoutLevel = raw.replace(/^(초등|중등|중학|고등)(?:학교)?과정\s*/, "");
    return withoutLevel.split(/[\s,]+/)[0] || "";
}
function groupByClass(list) {
    const groups = {};
    list.forEach((s) => {
        const key = extractClassName(s.class) || "반 미지정";
        (groups[key] = groups[key] || []).push(s);
    });
    const keys = Object.keys(groups).sort((a, b) => {
        if (a === "반 미지정")
            return 1;
        if (b === "반 미지정")
            return -1;
        return a.localeCompare(b, "ko");
    });
    return keys.map((k) => ({ className: k, list: groups[k] }));
}
function schoolLevelOf(s) {
    // 실제 다니는 학교명이 학년 단계의 진짜 기준이라 항상 먼저 확인한다. "수강과정"(중등과정/고등과정)은
    // 선행학습 반 이름일 뿐이라 실제 학교와 다를 수 있다 (예: 초등학교 6학년이 "중등과정 예비중" 반을
    // 듣는 경우 - courseLevel을 먼저 보면 "중6학년"이라는 있을 수 없는 조합이 나와버린다).
    const school = s.school || "";
    if (school.includes("초등") || /초$/.test(school))
        return "초";
    if (school.includes("중학") || /중$/.test(school))
        return "중";
    if (school.includes("고등") || /고$/.test(school))
        return "고";
    // 학교명이 비어있거나 위 패턴과 안 맞을 때만 수강과정으로 대체 추정한다.
    const level = parseClassString(s.class).courseLevel;
    if (level === "중등과정")
        return "중";
    if (level === "고등과정")
        return "고";
    return "";
}
function groupByGrade(list) {
    const buckets = {};
    list.forEach((s) => {
        const gradeNum = s.grade && String(s.grade).trim();
        const lvl = schoolLevelOf(s);
        const key = gradeNum ? `${lvl}${gradeNum}학년` : "학년 미지정";
        if (!buckets[key])
            buckets[key] = { level: lvl, grade: gradeNum ? parseInt(gradeNum, 10) || 0 : 0, list: [] };
        buckets[key].list.push(s);
    });
    const levelOrder = { "초": 0, "중": 1, "고": 2, "": 3 };
    const keys = Object.keys(buckets).sort((a, b) => {
        if (a === "학년 미지정")
            return 1;
        if (b === "학년 미지정")
            return -1;
        const A = buckets[a], B = buckets[b];
        const lo = (levelOrder[A.level] ?? 3) - (levelOrder[B.level] ?? 3);
        if (lo !== 0)
            return lo;
        return A.grade - B.grade;
    });
    return keys.map((k) => ({ className: k, list: buckets[k].list }));
}
function groupBySchool(list) {
    const groups = {};
    list.forEach((s) => {
        const key = s.school && s.school.trim() ? s.school.trim() : "학교 미지정";
        (groups[key] = groups[key] || []).push(s);
    });
    const keys = Object.keys(groups).sort((a, b) => {
        if (a === "학교 미지정")
            return 1;
        if (b === "학교 미지정")
            return -1;
        return a.localeCompare(b, "ko");
    });
    return keys.map((k) => ({ className: k, list: groups[k] }));
}
// 등원요일별 그룹핑 - 학생 한 명이 여러 요일에 다닐 수 있어서(예: 월수금), 다니는 요일 전부에
// 중복으로 나타난다("월요일에 누가 오는지" 보기에 맞춘 방식). 아무도 없는 요일은 그룹 자체를 만들지 않는다.
function groupByDay(list) {
    const groups = WEEKDAYS_MON_FIRST
        .map((d) => ({ className: `${d}요일`, list: list.filter((s) => (s.days || []).includes(d)) }))
        .filter((g) => g.list.length > 0);
    const unassigned = list.filter((s) => !s.days || s.days.length === 0);
    if (unassigned.length > 0)
        groups.push({ className: "요일 미지정", list: unassigned });
    return groups;
}
// 학생관리 탭 전용 "추가강좌별" 그룹핑 - 오늘 날짜 기준으로 "진행중"인 추가강좌(시작일~종료일 범위 안,
// 요일 조건은 보지 않음 - 특강 탭의 activeCourses와 달리 날짜별 출석체크가 아니라 학생 명단 보기이므로)만
// 대상으로 하고, 강좌명이 같으면 한 그룹으로 묶는다. 정규수업만 듣고 추가강좌가 없는 학생은 이 보기에서
// 제외된다(그룹핑 확인 시 원장님 확정사항). 한 학생이 같은 강좌를 요일별로 나눠 등록한 경우(예: 박성욱처럼
// 요일마다 시간이 달라 행이 2개인 경우)에도 같은 그룹 안에 학생 카드는 한 번만 나타나도록 studentId로 중복 제거한다.
function groupByExtraCourse(students, studentCourses) {
    const today = todayStr();
    const activeCourses = (studentCourses || []).filter((c) => {
        if (c.startDate && today < c.startDate) return false;
        if (c.endDate && today > c.endDate) return false;
        return true;
    });
    const studentById = {};
    students.forEach((s) => { studentById[s.id] = s; });
    const groups = {}; // courseName -> { seen: Set<studentId>, list: Student[] }
    activeCourses.forEach((c) => {
        const st = studentById[c.studentId];
        if (!st) return; // 퇴원 등으로 대상 학생 목록에 없으면 제외
        const key = c.courseName || "강좌명 미지정";
        if (!groups[key]) groups[key] = { seen: new Set(), list: [] };
        if (!groups[key].seen.has(st.id)) {
            groups[key].seen.add(st.id);
            groups[key].list.push(st);
        }
    });
    return Object.keys(groups).sort((a, b) => a.localeCompare(b, "ko")).map((k) => ({ className: k, list: groups[k].list }));
}

async function fetchStudentHistoryRows(studentId) {

    if (error)

// 학생 정보를 수정할 때 호출. effectiveFrom(적용 시작일) 기준으로 이력 타임라인을 다시 계산해서 저장한다.
// 같은 날짜에 이미 이력이 있으면 그 값을 새 값으로 덮어쓰고, 나머지 구간들의 종료일도 순서에 맞게 재정렬한다.
// (오늘부터 적용은 물론, 미래 날짜 예약이나 과거 날짜 정정도 모두 이 로직 하나로 처리된다.)
async function saveHistorySnapshot(studentId, effectiveFrom, snapshot) {
    const existing = await fetchStudentHistoryRows(studentId);
    const sameDateRows = existing.filter((r) => r.effectiveFrom === effectiveFrom);
    const others = existing.filter((r) => r.effectiveFrom !== effectiveFrom);
    const reuseRow = sameDateRows[0] || null; // 가장 먼저 생성된 행을 재사용 대상으로 삼는다
    const duplicateIds = sameDateRows.slice(1).map((r) => r.id); // 이미 쌓여있던 중복 행(있다면) 삭제 대상
    if (duplicateIds.length > 0) {
        const { error: dupError } = await supabaseClient.from("attn_student_history").delete().in("id", duplicateIds);
        if (dupError)
            throw dupError;
    }
    const newRow = reuseRow
        ? { ...reuseRow, ...snapshot, effectiveFrom, effectiveTo: null, isNew: false }
        : { effectiveFrom, effectiveTo: null, ...snapshot, isNew: true };
    const merged = [...others.map((r) => ({ ...r, isNew: false })), newRow]
        .sort((a, b) => (a.effectiveFrom < b.effectiveFrom ? -1 : a.effectiveFrom > b.effectiveFrom ? 1 : 0));
    for (let i = 0; i < merged.length; i++) {
        merged[i].effectiveTo = i === merged.length - 1 ? null : addDays(merged[i + 1].effectiveFrom, -1);
    }
    for (const row of merged) {
        const payload = {
            effective_to: row.effectiveTo, school: row.school, grade: row.grade, class: row.class,
            regular_time: row.regularTime, saturday_time: row.saturdayTime || null, clinic: row.clinic, clinic_time: row.clinicTime,
            clinic_days: row.clinicDays, days: row.days,
        };
        if (row.isNew) {
            const { error } = await supabaseClient.from("attn_student_history").insert({ student_id: studentId, effective_from: row.effectiveFrom, ...payload });
            if (error)
                throw error;
        }
        else {
            const { error } = await supabaseClient.from("attn_student_history").update(payload).eq("id", row.id);
            if (error)
                throw error;
        }
    }
}

                style: { background: t.key === "students" ? NAVY_SOFT : "transparent", color: t.key === "students" ? NAVY : SUBINK, textDecoration: "none" },
            }, h("span", { style: { fontSize: 15 } }, t.icon), t.label))
        ),

            { className: "px-4 py-4", style: { borderTop: `1px solid ${LINE}` } },
            h("div", { style: { fontSize: 12, fontWeight: 700, color: INK, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" } }, session.user.email),
            h("div", { className: "flex items-center gap-1.5 mt-1", style: { color: "#22c55e", fontSize: 11 } },
                h("span", { style: { width: 6, height: 6, borderRadius: 999, background: "#22c55e", display: "inline-block" } }),
                h("span", { style: { color: SUBINK } }, "실시간 동기화")),
            h("button", { onClick: handleLogout, className: "w-full mt-3 py-2 rounded-lg text-xs font-bold", style: { background: PAPER, color: SUBINK } }, "로그아웃")
        )
    );
    const mobileHeader = h(
        "header",

        h("a", { href: "index.html" }, h("img", { src: LOGO_HORIZONTAL, alt: "올곧수학 더센텀", style: { height: 24 } })),
        h("button", { onClick: handleLogout, style: { color: SUBINK, fontSize: 12, fontWeight: 700, background: PAPER, padding: "6px 10px", borderRadius: 8 } }, "로그아웃")
    );
    const mobileNav = h(
        "nav",
        { className: "md:hidden fixed bottom-0 inset-x-0 z-20 flex", style: { background: "#fff", borderTop: `1px solid ${LINE}` } },
        visibleNavItems.map((t) => h("a", {
            key: t.key,
            href: t.href,

}

// ============================================================
// 학생관리 페이지 최상위 컴포넌트
// 원래 attendance.html의 MainApp이 studentCourses(추가강좌 전체 목록)를 한 번 불러와서
// StudentManager에 props로 내려주던 구조를 그대로 유지한다(StudentManager 자체는 students는
// 직접 fetchStudents()로 관리하지만, studentCourses는 상위에서 받아 쓰는 구조라 그 부분만 옮김).
// goToWorkLog(근무일지 이동)는 attendance.html의 다른 탭(스태프룸)에 의존하는 기능이라 이 독립
// 페이지에는 해당 화면이 없다 - goToWorkLog는 넘기지 않아 그 버튼이 자동으로 숨겨진다(StudentManager
// 코드가 `goToWorkLog &&`로 이미 방어).
// prefill(진단평가 → 학생등록 다리)은 attendance.html에서 sessionStorage 키 "attn_cross_page_handoff"에
// { to: "studentPrefill", diagnosticTestId, name, phone, school, grade, token } 페이로드를 남겨두고
// location 이동해오는 방식으로 바뀌었다(2026-08 후속 수정, workboard.html의 workLog/clockIn 소비 로직과
// 동일한 계약). 마운트 시 한 번만 읽고 즉시 지워서(consume-once) 새로고침해도 다시 발동하지 않는다.
// ============================================================
function StudentsPage({ session }) {
    const [studentCourses, setStudentCourses] = useState([]);
    const [prefill, setPrefill] = useState(null);
    useEffect(() => {
        try {
            const raw = sessionStorage.getItem("attn_cross_page_handoff");
            if (!raw) return;
            sessionStorage.removeItem("attn_cross_page_handoff");
            const payload = JSON.parse(raw);
            if (payload && payload.to === "studentPrefill") {
                const { to, token, ...rest } = payload;
                setPrefill(rest);
            }
        } catch (e) { console.error(e); }
    }, []);
    const reloadStudentCourses = async () => {
        try {
            setStudentCourses(await fetchAllStudentCourses());
        } catch (e) {
            console.error(e);
        }
    };
    useEffect(() => { reloadStudentCourses(); }, []);
    // realtime: 다른 사람이 추가강좌를 등록/수정/삭제하면 자동 반영
    useEffect(() => {
        const channel = supabaseClient
            .channel("attn_student_courses_changes")
            .on("postgres_changes", { event: "*", schema: "public", table: "attn_student_courses" }, () => {
                reloadStudentCourses();
            })
            .subscribe();
        return () => { supabaseClient.removeChannel(channel); };
    }, []);
    return h(PageShell, { session, isDirector: true },
        h(StudentManager, {
            onChanged: undefined,
            prefill,
            onPrefillConsumed: () => setPrefill(null),
            studentCourses,
            reloadStudentCourses,
            goToWorkLog: undefined,
        })
    );
}

// ============================================================
// 로그인 12시간 후 자동 로그아웃 (index.html / attendance.html / allgoodstudy.html과 동일 정책,
// 같은 도메인이라 로그인 세션이 공유되므로 여기서도 같은 규칙을 맞춰둠)
// ============================================================
const LOGIN_AT_KEY = "attn_login_at";
const AUTO_LOGOUT_MS = 12 * 60 * 60 * 1000;

function Root() {
  const [session, setSession] = useState(null);
  const [checked, setChecked] = useState(false);

  useEffect(() => {
    const checkAutoLogout = () => {
      const loginAt = Number(localStorage.getItem(LOGIN_AT_KEY) || 0);
      if (loginAt && Date.now() - loginAt > AUTO_LOGOUT_MS) {
        supabaseClient.auth.signOut();
      }
    };
    supabaseClient.auth.getSession().then(({ data }) => {
      if (data.session && !localStorage.getItem(LOGIN_AT_KEY)) {
        localStorage.setItem(LOGIN_AT_KEY, String(Date.now()));
      }
      checkAutoLogout();
      setSession(data.session);
      setChecked(true);
    });
    const { data: sub } = supabaseClient.auth.onAuthStateChange((event, s) => {
      if (event === "SIGNED_IN") {
        localStorage.setItem(LOGIN_AT_KEY, String(Date.now()));
      } else if (event === "SIGNED_OUT") {
        localStorage.removeItem(LOGIN_AT_KEY);
      }
      setSession(s);
    });
    const timer = setInterval(checkAutoLogout, 5 * 60 * 1000);
    return () => { sub.subscription.unsubscribe(); clearInterval(timer); };
  }, []);

  if (!checked) {
    return h("div", { style: { minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: SUBINK, fontSize: 13 } }, "불러오는 중...");
  }
  if (!session) {
    return h(LoginScreen, null);
  }
  const isDirector = session.user.app_metadata && session.user.app_metadata.role === "director";
  if (!isDirector) {
    return h(DirectorOnlyMessage, null);
  }
  return h(StudentsPage, { session });
}

ReactDOM.createRoot(document.getElementById("root")).render(h(Root, null));
</script>
