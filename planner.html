// 날짜 유틸 (attendance.html / index.html과 동일 로직)
// ============================================================
const WEEKDAYS_MON_FIRST = ["월", "화", "수", "목", "금", "토", "일"];
const JS_DAY_TO_KOR = ["일", "월", "화", "수", "목", "금", "토"];
function fmt(d) {
    const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
}
function todayStr() { return fmt(new Date()); }
function addDays(dateStr, delta) {
    const d = new Date(dateStr + "T00:00:00");
    d.setDate(d.getDate() + delta);
    return fmt(d);
}
function korWeekdayOf(dateStr) {
    return JS_DAY_TO_KOR[new Date(dateStr + "T00:00:00").getDay()];
}

function EyeIcon({ off }) {
  const common = { width: 19, height: 19, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 1.8, strokeLinecap: "round", strokeLinejoin: "round" };
  return off
    ? h("svg", common,
        h("path", { d: "M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" }),
        h("path", { d: "M14.12 14.12a3 3 0 1 1-4.24-4.24" }),
        h("line", { x1: "1", y1: "1", x2: "23", y2: "23" })
      )
    : h("svg", common,
        h("path", { d: "M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" }),
        h("circle", { cx: "12", cy: "12", r: "3" })
      );
}

function LoginScreen() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [showPassword, setShowPassword] = useState(false);
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  const submit = async (e) => {
    e.preventDefault();
    setError("");
    setLoading(true);
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    setLoading(false);
    if (error) setError("이메일 또는 비밀번호가 올바르지 않습니다.");
  };
  return h("div", { style: { background: PAPER, minHeight: "100vh" }, className: "flex items-center justify-center px-4" },
    h("div", { className: "w-full max-w-sm rounded-2xl p-6", style: { background: "#fff", border: `1px solid ${LINE}` } },
      h("img", { src: LOGO_HORIZONTAL, alt: "올곧수학 더센텀", style: { height: 34, margin: "0 auto 20px", display: "block" } }),
      h("div", { style: { fontWeight: 800, fontSize: 15, textAlign: "center", marginBottom: 18, color: INK } }, "홈 로그인"),
      h("form", { onSubmit: submit, className: "flex flex-col gap-3" },
        h("input", { type: "email", required: true, value: email, onChange: (e) => setEmail(e.target.value), placeholder: "이메일", className: "px-3 py-3 rounded-lg text-sm outline-none", style: { border: `1px solid ${LINE}` } }),
        h("div", { style: { position: "relative" } },
          h("input", { type: showPassword ? "text" : "password", required: true, value: password, onChange: (e) => setPassword(e.target.value), placeholder: "비밀번호", className: "w-full px-3 py-3 rounded-lg text-sm outline-none", style: { border: `1px solid ${LINE}`, paddingRight: 42 } }),
          h("button", { type: "button", onClick: () => setShowPassword((v) => !v), "aria-label": showPassword ? "비밀번호 숨기기" : "비밀번호 보이기", style: { position: "absolute", right: 2, top: "50%", transform: "translateY(-50%)", width: 36, height: 36, display: "flex", alignItems: "center", justifyContent: "center", color: SUBINK, background: "transparent" } }, h(EyeIcon, { off: showPassword }))
        ),
        error && h("div", { style: { color: RED, fontSize: 12.5, fontWeight: 600 } }, error),
        h("button", { type: "submit", disabled: loading, className: "py-3 rounded-lg text-sm font-bold mt-1", style: { background: NAVY, color: "#fff", opacity: loading ? 0.6 : 1 } }, loading ? "로그인 중..." : "로그인")
      ),
      h("div", { style: { fontSize: 11.5, color: SUBINK, marginTop: 14, textAlign: "center" } }, "계정이 없다면 원장님께 문의하세요.")
    )
  );
}

// 학원운영관리 - 월간 일정표 (2026-11-02 신설, 원장·실장 director 권한 전용)
// 학생들에게 나눠주는 B5 가로 한 장짜리 월간 일정표를 앱 안에서 만들고 바로 인쇄한다.
//  - attn_planner_items : 일정표 칸에 적는 날짜별 문구(원장이 직접 고른 것만). 내부 학사일정
//    (attn_academic_events)은 학교 행사까지 전부 들어 있어서 그대로 찍으면 너무 많으므로 별도 테이블로 둔다.
//    필요한 학사일정은 "학사일정 불러오기"로 골라서 복사해 넣는다.
//  - 달력은 항상 6주(일요일 시작)로 그리고, 앞뒤 달 날짜 칸도 같은 테이블의 날짜를 그대로 보여준다.
//    → 11월 일정표 아랫줄에 12월 첫 주 일정이 자동으로 함께 찍힌다(12월 일정표에도 똑같이 나옴).
//  - 인쇄: 숨긴 iframe에 B5 가로(257×182mm) 전용 페이지를 만들어 브라우저 인쇄 창을 띄운다.
//    인쇄 창에서 "PDF로 저장"을 고르면 PDF 파일로도 받을 수 있다.

function seoulYM() {
    const p = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul", year: "numeric", month: "2-digit" }).formatToParts(new Date());
    return { y: Number(p.find((x) => x.type === "year").value), m: Number(p.find((x) => x.type === "month").value) };
}
function plannerYMFromHash() {
    const m = /^#(\d{4})-(\d{2})$/.exec(window.location.hash);
    return m ? { y: Number(m[1]), m: Number(m[2]) } : seoulYM();
}
function shiftMonth(ym, delta) {
    const d = new Date(ym.y, ym.m - 1 + delta, 1);
    return { y: d.getFullYear(), m: d.getMonth() + 1 };
}
// 6주(42칸) 날짜 배열 - 해당 월 1일이 속한 주의 일요일부터
function plannerGrid(ym) {
    const first = new Date(ym.y, ym.m - 1, 1);
    const start = new Date(ym.y, ym.m - 1, 1 - first.getDay());
    const days = [];
    for (let i = 0; i < 42; i++) {
        const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
        days.push({ date: fmt(d), y: d.getFullYear(), m: d.getMonth() + 1, d: d.getDate(), dow: d.getDay() });
    }
    return days;
}
// 다른 달 칸의 날짜 표기: 그 달의 1일이거나 주의 첫 칸이면 "12/1"처럼 월을 붙인다
function dayLabel(cell, ym, idx) {
    if (cell.m === ym.m) return String(cell.d);
    return (cell.d === 1 || idx % 7 === 0) ? `${cell.m}/${cell.d}` : String(cell.d);
}
function escHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function fetchPlannerItems(from, to) {
    const { data, error } = await supabaseClient.from("attn_planner_items").select("*")
        .gte("item_date", from).lte("item_date", to).order("item_date").order("sort_order").order("created_at");
    if (error) throw error;
    return data || [];
}

function buildPrintHtml(ym, grid, byDate) {
    const rows = [];
    for (let w = 0; w < 6; w++) {
        const tds = [];
        for (let i = 0; i < 7; i++) {
            const idx = w * 7 + i, cell = grid[idx];
            const other = cell.m !== ym.m;
            const items = (byDate[cell.date] || []).map((it) => `<div class="ev">${escHtml(it.title)}</div>`).join("");
            tds.push(`<td class="${i === 0 ? "sun" : ""}"><div class="d${other ? " other" : ""}">${dayLabel(cell, ym, idx)}</div>${items}</td>`);
        }
        rows.push(`<tr class="w">${tds.join("")}</tr>`);
    }
    return `<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>${ym.y}년 ${ym.m}월 일정표</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=block">

function printPlanner(html) {
    const old = document.getElementById("planner-print-frame");
    if (old) old.remove();
    const frame = document.createElement("iframe");
    frame.id = "planner-print-frame";
    frame.setAttribute("aria-hidden", "true");
    Object.assign(frame.style, { position: "fixed", right: "0", bottom: "0", width: "0", height: "0", border: "0", visibility: "hidden" });
    document.body.appendChild(frame);
    const doc = frame.contentWindow.document;
    doc.open(); doc.write(html); doc.close();
    const go = () => {
        const fontsReady = (doc.fonts && doc.fonts.ready) ? doc.fonts.ready : Promise.resolve();
        const img = doc.querySelector("img");
        const imgReady = (img && !img.complete) ? new Promise((r) => { img.onload = img.onerror = r; }) : Promise.resolve();
        Promise.all([fontsReady, imgReady]).then(() => setTimeout(() => {
            frame.contentWindow.focus();
            frame.contentWindow.print();
        }, 150));
    };
    if (doc.readyState === "complete") go(); else frame.onload = go;
}

function DayEditor({ date, items, onClose, onChanged }) {
    const [newTitle, setNewTitle] = useState("");
    const [edits, setEdits] = useState({});
    const [busy, setBusy] = useState(false);
    const [err, setErr] = useState("");
    const run = async (fn) => {
        setBusy(true); setErr("");
        try { await fn(); await onChanged(); } catch (e) { setErr(e.message || "저장하지 못했습니다."); }
        setBusy(false);
    };
    const add = (title) => run(async () => {
        const t = (title || "").trim();
        if (!t) return;
        const maxOrder = items.reduce((a, it) => Math.max(a, it.sort_order || 0), 0);
        const { error } = await supabaseClient.from("attn_planner_items").insert({ item_date: date, title: t, sort_order: maxOrder + 1 });
        if (error) throw error;
        setNewTitle("");
    });
    const saveEdit = (it) => run(async () => {
        const t = (edits[it.id] ?? it.title).trim();
        if (!t || t === it.title) return;
        const { error } = await supabaseClient.from("attn_planner_items").update({ title: t, updated_at: new Date().toISOString() }).eq("id", it.id);
        if (error) throw error;
        setEdits((e) => { const n = { ...e }; delete n[it.id]; return n; });
    });
    const remove = (it) => run(async () => {
        const { error } = await supabaseClient.from("attn_planner_items").delete().eq("id", it.id);
        if (error) throw error;
    });
    const move = (idx, delta) => run(async () => {
        const list = items.slice();
        const j = idx + delta;
        if (j < 0 || j >= list.length) return;
        [list[idx], list[j]] = [list[j], list[idx]];
        for (let k = 0; k < list.length; k++) {
            if (list[k].sort_order !== k + 1) {
                const { error } = await supabaseClient.from("attn_planner_items").update({ sort_order: k + 1 }).eq("id", list[k].id);
                if (error) throw error;
            }
        }
    });
    const d = new Date(date + "T00:00:00");
    const inputCls = "flex-1 min-w-0 px-3 py-2 rounded-lg text-sm";
    const inputStyle = { border: `1px solid ${LINE}`, outline: "none" };
    return h(Modal, { onClose, title: `${d.getMonth() + 1}월 ${d.getDate()}일 (${KOR_DAY[d.getDay()]})` },
        items.length === 0 && h("div", { style: { fontSize: 13, color: SUBINK, padding: "4px 0 12px" } }, "아직 적힌 일정이 없어요."),
        items.map((it, idx) => {
            const val = edits[it.id] ?? it.title;
            const dirty = val.trim() !== it.title;
            return h("div", { key: it.id, className: "flex items-center gap-1.5 mb-2" },
                h("input", { value: val, disabled: busy, className: inputCls, style: inputStyle,
                    onChange: (e) => setEdits((s) => ({ ...s, [it.id]: e.target.value })),
                    onKeyDown: (e) => { if (e.key === "Enter") saveEdit(it); } }),
                dirty && h("button", { onClick: () => saveEdit(it), disabled: busy, className: "px-2.5 py-2 rounded-lg text-xs font-bold", style: { background: NAVY, color: "#fff" } }, "저장"),
                h("button", { onClick: () => move(idx, -1), disabled: busy || idx === 0, title: "위로", className: "px-2 py-2 rounded-lg text-xs", style: { background: PAPER, color: idx === 0 ? LINE : SUBINK } }, "▲"),
                h("button", { onClick: () => move(idx, 1), disabled: busy || idx === items.length - 1, title: "아래로", className: "px-2 py-2 rounded-lg text-xs", style: { background: PAPER, color: idx === items.length - 1 ? LINE : SUBINK } }, "▼"),
                h("button", { onClick: () => remove(it), disabled: busy, title: "삭제", className: "px-2.5 py-2 rounded-lg text-xs font-bold", style: { background: RED_SOFT, color: RED } }, "삭제")
            );
        }),
        h("div", { className: "mt-4 pt-4", style: { borderTop: `1px solid ${LINE}` } },
            h("div", { className: "flex gap-1.5" },
                h("input", { value: newTitle, disabled: busy, placeholder: "새 일정 문구 (예: 내신대비 보강)", className: inputCls, style: inputStyle,
                    onChange: (e) => setNewTitle(e.target.value), onKeyDown: (e) => { if (e.key === "Enter") add(newTitle); } }),
                h("button", { onClick: () => add(newTitle), disabled: busy || !newTitle.trim(), className: "px-4 py-2 rounded-lg text-sm font-bold", style: { background: NAVY, color: "#fff", opacity: newTitle.trim() ? 1 : 0.4 } }, "추가")
            ),
            h("div", { className: "flex flex-wrap gap-1.5 mt-2.5" },
                PLANNER_QUICK.map((q) => h("button", { key: q, onClick: () => add(q), disabled: busy, className: "px-3 py-1.5 rounded-full text-xs font-bold", style: { background: NAVY_SOFT, color: NAVY } }, "+ " + q))
            )
        ),
        err && h("div", { style: { color: RED, fontSize: 12.5, fontWeight: 600, marginTop: 10 } }, err)
    );
}

function ImportDialog({ ym, grid, existing, onClose, onChanged }) {
    const [rows, setRows] = useState(null);
    const [busy, setBusy] = useState(false);
    const [err, setErr] = useState("");
    const from = grid[0].date, to = grid[41].date;
    useEffect(() => {
        (async () => {
            const { data, error } = await supabaseClient.from("attn_academic_events")
                .select("id, event_date, end_date, title, event_type, scope, school")
                .in("event_type", IMPORT_TYPES)
                .lte("event_date", to)
                .or(`end_date.gte.${from},and(end_date.is.null,event_date.gte.${from})`)
                .order("event_date");
            if (error) { setErr(error.message); setRows([]); return; }
            const out = [];
            const has = new Set(existing.map((it) => it.item_date + "|" + it.title));
            (data || []).forEach((ev) => {
                const label = ev.scope === "학교" && ev.school ? `${ev.school} ${ev.title}` : ev.title;
                let cur = ev.event_date;
                const end = ev.end_date || ev.event_date;
                while (cur <= end) {
                    if (cur >= from && cur <= to) {
                        out.push({ key: ev.id + "|" + cur, date: cur, type: ev.event_type, title: label, picked: false, dup: has.has(cur + "|" + label) });
                    }
                    cur = addDays(cur, 1);
                }
            });
            out.sort((a, b) => a.date.localeCompare(b.date));
            setRows(out);
        })();
    }, []);
    const toggle = (k) => setRows((rs) => rs.map((r) => r.key === k ? { ...r, picked: !r.picked } : r));
    const retitle = (k, t) => setRows((rs) => rs.map((r) => r.key === k ? { ...r, title: t, picked: true } : r));
    const picked = (rows || []).filter((r) => r.picked && r.title.trim());
    const submit = async () => {
        setBusy(true); setErr("");
        const maxBy = {};
        existing.forEach((it) => { maxBy[it.item_date] = Math.max(maxBy[it.item_date] || 0, it.sort_order || 0); });
        const payload = picked.map((r) => { maxBy[r.date] = (maxBy[r.date] || 0) + 1; return { item_date: r.date, title: r.title.trim(), sort_order: maxBy[r.date] }; });
        const { error } = await supabaseClient.from("attn_planner_items").insert(payload);
        setBusy(false);
        if (error) { setErr(error.message); return; }
        await onChanged();
        onClose();
    };
    return h(Modal, { onClose, title: "학사일정 불러오기", wide: true },
        h("div", { style: { fontSize: 12.5, color: SUBINK, marginBottom: 12 } },
            `${ym.m}월 일정표 칸(${from.slice(5).replace("-", "/")} ~ ${to.slice(5).replace("-", "/")})에 해당하는 공휴일·수능·학원일정·시험을 보여줘요. 넣을 것만 고르고, 문구는 고쳐서 넣을 수 있어요.`),
        rows === null ? h("div", { style: { fontSize: 13, color: SUBINK, padding: 16 } }, "불러오는 중...")
        : rows.length === 0 ? h("div", { style: { fontSize: 13, color: SUBINK, padding: 16 } }, "해당 기간에 학사일정이 없어요.")
        : h("div", { style: { maxHeight: "52vh", overflowY: "auto", border: `1px solid ${LINE}`, borderRadius: 12 } },
            rows.map((r) => {
                const d = new Date(r.date + "T00:00:00");
                return h("label", { key: r.key, className: "flex items-center gap-2.5 px-3 py-2", style: { borderBottom: `1px solid ${LINE}`, background: r.picked ? NAVY_SOFT : "#fff", cursor: "pointer" } },
                    h("input", { type: "checkbox", checked: r.picked, onChange: () => toggle(r.key) }),
                    h("span", { style: { width: 62, fontSize: 12.5, fontWeight: 700, color: d.getDay() === 0 ? RED : INK, whiteSpace: "nowrap" } }, `${d.getMonth() + 1}/${d.getDate()} (${KOR_DAY[d.getDay()]})`),
                    h("span", { style: { fontSize: 11, fontWeight: 700, color: SUBINK, width: 52, whiteSpace: "nowrap" } }, r.type),
                    h("input", { value: r.title, onChange: (e) => retitle(r.key, e.target.value), onClick: (e) => e.stopPropagation(), className: "flex-1 min-w-0 px-2 py-1.5 rounded-md text-sm", style: { border: `1px solid ${LINE}`, background: "#fff" } }),
                    r.dup && h("span", { style: { fontSize: 11, color: AMBER, fontWeight: 700, whiteSpace: "nowrap" } }, "이미 있음")
                );
            })
        ),
        err && h("div", { style: { color: RED, fontSize: 12.5, fontWeight: 600, marginTop: 10 } }, err),
        h("div", { className: "flex justify-end gap-2 mt-4" },
            h("button", { onClick: onClose, className: "px-4 py-2.5 rounded-lg text-sm font-bold", style: { background: PAPER, color: SUBINK } }, "취소"),
            h("button", { onClick: submit, disabled: busy || picked.length === 0, className: "px-4 py-2.5 rounded-lg text-sm font-bold", style: { background: NAVY, color: "#fff", opacity: picked.length ? 1 : 0.4 } },
                picked.length ? `${picked.length}개 넣기` : "넣을 일정 선택")
        )
    );
}

function Modal({ title, onClose, wide, children }) {
    useEffect(() => {
        const onKey = (e) => { if (e.key === "Escape") onClose(); };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
    }, [onClose]);
    return h("div", { className: "fixed inset-0 z-50 flex items-end sm:items-center justify-center", style: { background: "rgba(17,24,39,.45)" }, onClick: onClose },
        h("div", { className: "w-full rounded-t-2xl sm:rounded-2xl p-5", style: { background: "#fff", maxWidth: wide ? 640 : 440, maxHeight: "90vh", overflowY: "auto" }, onClick: (e) => e.stopPropagation() },
            h("div", { className: "flex items-center justify-between mb-4" },
                h("div", { style: { fontWeight: 800, fontSize: 16, color: INK } }, title),
                h("button", { onClick: onClose, "aria-label": "닫기", style: { fontSize: 20, color: SUBINK, lineHeight: 1 } }, "×")
            ),
            children
        )
    );
}

// ============================================================
// 로그인 12시간 후 자동 로그아웃 (index.html / attendance.html / allgoodstudy.html과 동일 정책,
// 같은 도메인이라 로그인 세션이 공유되므로 여기서도 같은 규칙을 맞춰둠)
// ============================================================
const LOGIN_AT_KEY = "attn_login_at";
const AUTO_LOGOUT_MS = 12 * 60 * 60 * 1000;

function Root() {
  const [session, setSession] = useState(null);
  const [checked, setChecked] = useState(false);

  useEffect(() => {
    const checkAutoLogout = () => {
      const loginAt = Number(localStorage.getItem(LOGIN_AT_KEY) || 0);
      if (loginAt && Date.now() - loginAt > AUTO_LOGOUT_MS) {
        supabaseClient.auth.signOut();
      }
    };
    supabaseClient.auth.getSession().then(({ data }) => {
      if (data.session && !localStorage.getItem(LOGIN_AT_KEY)) {
        localStorage.setItem(LOGIN_AT_KEY, String(Date.now()));
      }
      checkAutoLogout();
      setSession(data.session);
      setChecked(true);
    });
    const { data: sub } = supabaseClient.auth.onAuthStateChange((event, s) => {
      if (event === "SIGNED_IN") {
        localStorage.setItem(LOGIN_AT_KEY, String(Date.now()));
      } else if (event === "SIGNED_OUT") {
        localStorage.removeItem(LOGIN_AT_KEY);
      }
      setSession(s);
    });
    const timer = setInterval(checkAutoLogout, 5 * 60 * 1000);
    return () => { sub.subscription.unsubscribe(); clearInterval(timer); };
  }, []);

  if (!checked) {
    return h("div", { style: { minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: SUBINK, fontSize: 13 } }, "불러오는 중...");
  }
  if (!session) {
    return h(LoginScreen, null);
  }
  const isDirector = session.user.app_metadata && session.user.app_metadata.role === "director";
  if (!isDirector) {
    return h(DirectorOnlyMessage, null);
  }
  return h(PlannerPage, { session });
}

ReactDOM.createRoot(document.getElementById("root")).render(h(Root, null));
</script>
